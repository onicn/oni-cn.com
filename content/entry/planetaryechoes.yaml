- contents:
  - widget_type: CodexText
    text: 回声其二
    style: Subtitle
  - widget_type: CodexText
    text: >
      奥莉维亚：这到底是什么？


      [一个张开的手掌将纸落猛摔在桌子上。]


      奥莉维亚：这些读数表明每次转换后都会积累几百千克的中子质。你准备什么时候告诉我啊？


      杰姬：我正在解决这个问题。


      奥莉维亚：杰姬，要是安全无法保证，我们可没有走捷径的资本。


      杰姬：我想我有能力监管我自己的安全。


      奥莉维亚：我-我不仅仅是在关心<i>你的</i>安全！我们不知道我们在这里开发的东西长期下去会有什么影响……我们在这里总结的方法可能会导致全世界范围的涟漪效应，甚至全宇宙。


      杰姬：不要危言耸听，这话不适合科学家。而且，我要提醒你，这项研究有可能停止能源战争的发展，结束成千上万人的痛苦。我们在这里每个月花在试验上的时间拖延了这个结果。


      奥莉维亚：这真的很危险。


      杰姬：我会注意你的关心的。

      ------------------
