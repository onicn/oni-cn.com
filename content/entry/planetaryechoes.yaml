- contents:
  - widget_type: CodexText
    text: 回声其一
    style: Subtitle
  - widget_type: CodexText
    text: >
      奥莉维亚：我们已经再次检查了一遍我们的观测设备，而且电脑的启动马上就要完成了。出现任何故障我们的防备人员就会立刻关掉它。


      奥莉维亚：是时候了。


      杰姬：没错。


      杰姬：让机器慢点起转吧，这样我们就可以检测到任何异常的动力波动了。数“3”就开始。


      杰姬：“1”……“2”……


      杰姬：“3”。


      [有金属碰撞声，可以听到机器低沉的嗡嗡声。]


      杰姬：有点不对劲。


      奥莉维亚：是容器……原子振动得太快了。


      [机器的嗡嗡声变为刺耳的声音了。]


      奥莉维亚：我-我们必须要中止了！


      杰姬：不，还不行。降低冷却系统的电力，用这部分电力维持容器的平衡，它会稳定下来的。


      奥莉维亚：但没有冷却液的话——


      杰姬：它会稳定的！


      [有刺耳的电噼啪声。]


      奥莉维亚：降低冷却系统的40%电力，将一切都调整到原子容器中去！


      [嗡嗡声逐渐增强，然后降为稳定的杂声。]


      奥莉维亚：做到了，容器稳定了。


      [杰姬松了口气。]


      奥莉维亚：但是……看看这些数字。


      杰姬：我的天，这些都是真的吗？


      奥莉维亚：是的，我很确信是真的。杰姬，我认为我们做到了。


      奥莉维亚：我想我们创造出了无限能源。

      ------------------
    style: Body
