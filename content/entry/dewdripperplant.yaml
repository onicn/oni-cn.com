- contents:
  - widget_type: CodexText
    text: >-
      露珠藤根部环绕着华丽的羽毛状叶子，有时被称为植物界的“紫椋鸟”。


      这种雕塑般的植物会缓慢滴落遇到空气而凝固的多余汁液。由此产生的球珠非常致密，以至于在地下种植时其重量会折断露珠藤的中空茎。


      从来没人被掉落的露珠严重砸伤过，但也最好不要在下面逗留。
    style: Body
  layout: Vertical
