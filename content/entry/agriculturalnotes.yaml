    text: >-
      <smallcaps>[声纹识别系统初始化完成]

      [识别编号：B577]</smallcaps>


      [录音开始]


      遗传学家：我们已经根据环境情况培育出了轮作作物。虽然多样化的植物是解决任何其余营养需求的理想选择，但我们的任何一种设计都足以无限期地维持殖民地居民的生存，而不会对大家的身体健康造成不良影响。


      遗传学家：一些环境生存问题仍然存在。其中最为重要的是不同的温度、光照可用性以及最近营养水平的变化，对生产食物和氧气的植物来说尤为如此。


      [录音结束]
    style: Body
  layout: Vertical
  lock_id: notes_agriculture1
- contents:
  - widget_type: CodexText
    text: >
      <smallcaps>[检测到录音片段]

      [声纹识别系统不可用]</smallcaps>


      [录音开始]


      ……选择这个是为了解决殖民地居民的心理健康问题。


      虽然设计应该关注将情绪提升效果归因于诱人荆棘自然的信息素释放，但该项目已被移至侧重于生命维持的设计之下，是最低优先级了……


      [录音结束]

