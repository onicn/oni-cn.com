- contents:
  - widget_type: CodexText
    text: >-
      一种可充能的<link="ELECTROBANK">移动电源</link>。


      可以通过<link="LARGEELECTROBANKDISCHARGER">大型放电器</link>或<link="SMALLELECTROBANKDISCHARGER">袖珍放电器</link>为建筑供电。


      复制人可以在<link="ADVANCEDCRAFTINGTABLE">焊接台</link>生产新的<link="ELECTROBANK">复用移动电源</link>。


      必须保持干燥。
    style: Body
