      木材是很好的<link="HEAT">热量</link>和<link="POWER">电力</link>来源。


      隔热性能和优良的<link="DECOR">装饰度</link>使其成为有用的<b>建造材料</b>。


      资源种类：有机物

      熔点：600ºC

      硬度：<color=#6D7BC1FF>18（柔软）</color>


      比热容：2.300 (DTU/g)/ºC

      热导率：0.220 (DTU/(m*s))/ºC

      辐射吸收因数：0.6

      辐射释放量/1000千克：0拉德/周期


      属性：<link="BUILDINGWOOD">木材</link>, <link="INDUSTRIALINGREDIENT">工业原料</link>, <link="ELEMENTSSOLID">固体</link>, 有机物
    style: Body
  - widget_type: CodexSpacer
