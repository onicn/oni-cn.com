- contents:
  - widget_type: CodexText
    text: >-
      增幅块是用于改进和扩展仿生复制人能力的编程模块。


      增幅块在使用时会消耗大量处理算力。仿生复制人可通过积累技能点扩展增幅块安装容量。


      增幅块可以相互组合从而获得更广泛的技能，也可以抵消原始编程中可能存在的仿生漏洞。
    style: Body
