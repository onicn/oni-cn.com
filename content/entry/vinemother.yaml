  - widget_type: CodexText
    text: >-
      漫殖藤主干是一种侵略性植物，会侵占附近的可用表面。


      单个<link="VINEMOTHER">漫殖藤主干</link>可在对<link="WATER">水</link>需求不变的情况下维持多条<link="VINEMOTHER">漫殖藤</link>。
    style: Body
  - widget_type: CodexText
