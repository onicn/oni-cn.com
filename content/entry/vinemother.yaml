- contents:
  - widget_type: CodexText
    text: >-
      漫殖藤是一种生命力顽强的植物，拥有高效的养分储存与再分配系统。健康主干产生的能量远超自身需求，这些盈余能量会用于生长探索性藤蔓，向周边领地扩张。


      藤蔓完全依赖主干供给养分，每条藤蔓都生有钩状尖刺：既能保护未成熟果实，又可充当攀爬钉，使藤蔓能在任何空置表面蔓延。这些尖刺也让清除藤蔓变得异常麻烦。
    style: Body
  layout: Vertical
