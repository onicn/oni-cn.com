    style: Title
  - widget_type: CodexText
    text: 食肉小动物
    style: Subtitle
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      尽管看起来凶悍，霸王鹦实则是情感细腻的生物，它们尤其依赖正向激励，特别是肯定的言语。


      这些无眼的顶级掠食者拥有强酸性胃液，能杀死绝大多数已知细菌和毒素，从而安全消化猎物。但如果食物匮乏，这种保护机制反而会使它们易患慢性胃溃疡。


      霸王鹦的尾羽可修剪采集纤维用于纺织生产。它们对此并不介意 - 有些甚至乐在其中。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexSpacer
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: raptor_0__ui
  - widget_type: CodexImage
    image: baby_raptor_0__ui
  layout: Horizontal
- contents:
  - widget_type: CodexText
    text: >-
      霸王鹦是一种食肉小动物，以更小型的<link="CREATURES">小动物</link>为食并产生<link="BRINEICE">浓盐冰</link>。


      其尾羽可以剪成<link="FEATHERFABRIC">羽毛纤维</link>。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 理想温度
    style: Subtitle
  - widget_type: CodexText
    text: '    • 舒适范围：<b>-50ºC</b>至<b>15ºC</b>'
    style: Body
  - widget_type: CodexText
    text: '    • 存活范围：<b>-100ºC</b>至<b>100ºC</b>'
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 寿命
    style: Subtitle
  - widget_type: CodexText
    text: 这种小动物特征<link="CREATURES__GUIDE__FERTILITY">寿命</link>为<b>200周期</b>。
    style: Body
  layout: Vertical
- contents:
