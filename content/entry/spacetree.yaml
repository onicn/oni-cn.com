  - widget_type: CodexText
    text: >-
      糖心树枝杈能吸收<link="LIGHT">光</link>并产生<link="SUGARWATER">花蜜</link>。


      枝杈可收获以获得<link="WOOD">木材</link>。


      糖心树可以摆脱大多数环境杂物，很少被掩埋。
    style: Body
  - widget_type: CodexText
    text: >-
      <b>生长需求</b>：
          • 最大<link="RADIATION">辐射</link>：12,200拉德/周期
          • 生长周期：4.5周期
          • <link="HEAT">温度</link>：-75至-15ºC
          • <link="ATMOSPHERE">环境</link>：
              • <link="OXYGEN">氧气</link>
              • <link="CONTAMINATEDOXYGEN">污染氧</link>
              • <link="CARBONDIOXIDE">二氧化碳</link>
              • <link="SNOW">雪</link>
              • <link="VACUUM">真空</link>
          • <link="SNOW">雪</link>：-100千克/周期
          • 农地
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <b>效果</b>：
          • <link="SUGARWATER">花蜜</link>：20千克
          • 基础<link="PLANTS">种子</link>收获几率：10%
          • <link="DECOR">装饰度</link>：-10（范围：2格）
    style: Body
