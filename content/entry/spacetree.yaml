- contents:
  - widget_type: CodexText
    text: >-
      糖心树是一种高耸的植物，可以在零下温度中茁壮成长。其具有多个独立的功能茎，通过明亮的光照将营养物质汇集到中空的中心核中。


      这种树完全成熟后，核心部位就会分泌消化酶，能将多余的营养物质分解并以粘稠、甜蜜的液体形态储存。这种液体可以提炼成<link="SUCROSE">蔗糖</link>以供高级食物的生产使用，或者用于维持栓角海豹养殖。


      糖心树通常被认为是碍事的东西，如果没有美味的产出物，很有可能会被根除。
    style: Body
  layout: Vertical
