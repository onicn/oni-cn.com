      <smallcaps><b>周五便装日！</b>

      发件人：<b>管理员</b> <alpha=#AA><admin@gravitas.nova></color>

      收件人：<b>全体</b></smallcaps>

      ------------------


      <indent=5%>致所有员工；


      研究所很高兴地通知大家，从本周开始，所有星期五都将是便装日！


      临床证明，便装有减压的好处，所以请穿上你们最喜欢的衬衫开始享受吧。


      <b>请注意：如果我们发现有人没有全身防护，将立即通告批评。</b>


      谢谢大家！祝大家开心！


      - 管理员

      庄严科技</indent>
