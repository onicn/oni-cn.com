id: EGGCRACKER
parent_id: BUILDCATEGORYFOOD
name: 敲蛋桌
disabled: False
search_only: False
category: BUILDCATEGORYFOOD
sort_string: 敲蛋桌
content_container:
- contents:
  - widget_type: CodexText
    text: <link="EGGCRACKER">敲蛋桌</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 食物制备
    style: Body
    image: research_type_alpha_icon
    link_id: finedining
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: egg_cracker_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      将可孵化的<link="CREATURES">小动物</link>蛋转化为烹饪原料。


      破裂的蛋无法孵化。


      只有在队列中安排配方复制人才会进行打蛋。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>50千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：+5（范围：1格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>1</b>格内提高<b><b>+5</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>生蛋是某些高品质食品配方中的原料。</i>
    style: Body
  layout: Vertical
