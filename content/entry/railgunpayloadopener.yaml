content_container:
- contents:
  - widget_type: CodexText
    text: <link="RAILGUNPAYLOADOPENER">载货拆包器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 机器人工具
    style: Body
    image: research_type_alpha_icon
    link_id: robotictools
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: railgun_emptier_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      将由复制人运送来的<link="RAILGUNPAYLOAD">星际载货</link>拆包。


      自动分离<link="ELEMENTSSOLID">固体</link>、<link="ELEMENTSLIQUID">液体</link>和<link="ELEMENTSGAS">气体</link>材料，并分配到相应的系统中。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>100千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+500复制热/秒'
    tooltip: >-
      每秒产生<style="produced">500复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>载货拆包器可以与运输系统，水管系统，通风系统相连以便分类。</i>
    style: Body
  layout: Vertical
