content_container:
- contents:
  - widget_type: CodexText
    text: <link="CLUSTERTELESCOPE">望远镜</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 高级研究
    style: Body
    image: research_type_alpha_icon
    link_id: advancedresearch
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: telescope_low_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      揭示太空中可前往的小行星。


      分配的复制人必须具有<link="ASTRONOMY">天文学</link>技能。


      建筑必须暴露在太空中才能运作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="ASTRONOMY">天文学</link>技能或<link="BOOSTERRESEARCH2">天文学增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+125复制热/秒'
    tooltip: >-
      每秒产生<style="produced">125复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSSCIENCEBUILDING">科学建筑</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>望远镜是研究太空的必要工具，允许火箭探索其他星球。</i>
    style: Body
  layout: Vertical
