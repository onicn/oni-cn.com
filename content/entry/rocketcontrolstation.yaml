    tooltip: 控制火箭内的建筑是否可操作
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '        • 建筑：<link="ARCADEMACHINE">游戏机台</link>, <link="BEACHCHAIR">沙滩椅</link>, <link="BED">床铺</link>, <link="DININGTABLE">餐桌</link>, <link="FLUSHTOILET">抽水马桶</link>, <link="FOODREHYDRATOR">充水机</link>, <link="GUNKEMPTIER">粘渣油提取器</link>, <link="HANDSANITIZER">手部消毒站</link>, <link="HOTTUB">热水浴缸</link>, <link="JUICER">榨汁机</link>, <link="LADDER">梯床</link>, <link="LUXURYBED">舒适的床</link>, <link="MECHANICALSURFBOARD">机械冲浪板</link>, <link="OUTHOUSE">户外厕所</link>, <link="PHONOBOX">点唱机器人</link>, <link="RATIONBOX">口粮箱</link>, <link="REFRIGERATOR">冰箱</link>, <link="SAUNA">桑拿房</link>, <link="SHOWER">淋浴隔间</link>, <link="SODAFOUNTAIN">汽水机</link>, <link="STORAGELOCKER">存储箱</link>, <link="STORAGELOCKERSMART">智能存储箱</link>, <link="STORAGETILE">存储砖</link>, <link="TELEPHONE">共线电话</link>, <link="VERTICALWINDTUNNEL">垂直风洞</link>, <link="WALLTOILET">墙排马桶</link>, <link="WASHSINK">洗手池</link>, <link="WATERCOOLER">饮水机</link>, 柴堆'
    tooltip: >-
      这里可以控制以下建筑的可操作状态：


      <link="ARCADEMACHINE">游戏机台</link>, <link="BEACHCHAIR">沙滩椅</link>, <link="BED">床铺</link>, <link="DININGTABLE">餐桌</link>, <link="FLUSHTOILET">抽水马桶</link>, <link="FOODREHYDRATOR">充水机</link>, <link="GUNKEMPTIER">粘渣油提取器</link>, <link="HANDSANITIZER">手部消毒站</link>, <link="HOTTUB">热水浴缸</link>, <link="JUICER">榨汁机</link>, <link="LADDER">梯床</link>, <link="LUXURYBED">舒适的床</link>, <link="MECHANICALSURFBOARD">机械冲浪板</link>, <link="OUTHOUSE">户外厕所</link>, <link="PHONOBOX">点唱机器人</link>, <link="RATIONBOX">口粮箱</link>, <link="REFRIGERATOR">冰箱</link>, <link="SAUNA">桑拿房</link>, <link="SHOWER">淋浴隔间</link>, <link="SODAFOUNTAIN">汽水机</link>, <link="STORAGELOCKER">存储箱</link>, <link="STORAGELOCKERSMART">智能存储箱</link>, <link="STORAGETILE">存储砖</link>, <link="TELEPHONE">共线电话</link>, <link="VERTICALWINDTUNNEL">垂直风洞</link>, <link="WALLTOILET">墙排马桶</link>, <link="WASHSINK">洗手池</link>, <link="WATERCOOLER">饮水机</link>, 柴堆
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    限制建筑使用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：限制内部建筑的使用

      • <b><style="logic_off">红色信号</style></b>：不限制内部建筑的使用
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：+15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内提高<b><b>+15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSROCKETINTERIOR">火箭内部</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>当屏幕保护程序启动时，需要有人来晃动一下控制杆。</i>
