id: GASMINIPUMP
parent_id: BUILDCATEGORYHVAC
name: 小型气泵
disabled: False
search_only: False
category: BUILDCATEGORYHVAC
sort_string: 小型气泵
content_container:
- contents:
  - widget_type: CodexText
    text: <link="GASMINIPUMP">小型气泵</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 泵小型化
    style: Body
    image: research_type_alpha_icon
    link_id: valveminiaturization
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: minigaspump_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      抽取少量<link="ELEMENTSGAS">气体</link>并通过<link="GASPIPING">管道</link>输送。


      必须浸没在<link="ELEMENTSGAS">气体</link>中。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    气体的供给'
    tooltip: 必须接收运送的<style="KKeyword">气体</style>才能运作
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：60瓦'
    tooltip: 必须与至少有<style="consumed">60瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GASPIPING">气体输出管道</link>'
    tooltip: 必须通过<link="GASCONDUIT">气体管道</link>系统排出<style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：60秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="PLASTIC">塑料</link>50千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    气体：50克/秒'
    tooltip: 使用时消耗<style="consumed">50克/秒</style><style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>小型气泵可以最少电力来抽取少量气体。</i>
    style: Body
  layout: Vertical
