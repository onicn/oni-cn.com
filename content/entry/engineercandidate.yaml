      <indent=10%><smallcaps><b>将创意性工作空间理念引入工业环境</b>


      米克尔E.E.珀尔缪特是世界工业设计的冉冉新星，他为想不出好点子的劳动力策划有趣的工作空间，并以此出名。


      “动力椅子该扔了。”珀尔缪特说道。“我感兴趣的是重新设计的工业空间。机器就是应该稀奇古怪才好。”


      正是这种理念使珀尔缪特登上了热门新工业设计者的榜首。</indent></smallcaps>
