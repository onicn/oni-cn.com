- contents:
  - widget_type: CodexText
    text: 寒冷的<link="FEATHERFABRIC">寒羽</link>生态是巨大而不会飞的<link="RAPTORSPECIES">霸王鹦</link>的家园，它们可以修剪羽毛用于<link="CLOTHING">纺织生产</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <link="RAPTORSPECIES">霸王鹦</link>是一种以<link="CHAMELEONSPECIES">逸蜥</link>为主要猎物的食肉小动物。这两种小动物都可以作为<link="FOOD">食物</link>，但<link="RAPTORSPECIES">霸王鹦</link>的肉太韧了，没法生吃。


      这种生态的植物包括偏爱<link="CHLORINEGAS">氯气</link>环境的巨大<link="DINOFERN">巨蕨</link>，能加工出<link="MILK">咸乳</link>的<link="DEWDRIPPERPLANT">露珠藤</link>，以及凉爽的<link="COLDBREATHER">冰息萝卜</link>。


      在这种环境中工作与生活的复制人需要防护性<link="EQUIPMENT">装备</link>。
    style: Body
