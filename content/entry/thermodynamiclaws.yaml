      <smallcaps>收件人：<b>克劳斯先生</b><alpha=#AA><size=12> <okraus@gravitas.nova></size></color>

      发件人：<b>琼斯博士</b><alpha=#AA><size=12> <ejones@gravitas.nova></size></color></smallcaps>

