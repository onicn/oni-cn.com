- contents:
  - widget_type: CodexText
    text: >+
      今早一到实验室就见到了斯特恩主管。她正在看我那个希克苏鲁伯陨石复发模型，我刚想解释这只是处理其他数据时的消遣练手项目，她就递了个硬盘说：“用你的程序跑这些数据。”


      更新后的曲线图简直疯狂！


      数据刚加载完，主管就把所有结果拷回硬盘，扔下句“全部删除”就走了。


      没想到她对理论物理游戏这么感兴趣。我想庄严科技够凑个兴趣小组吗？我发邮件问了斯克洛多夫斯卡博士——我是说，玛格达莱娜——但她还没回我之前六封邮件，也许嫌我问题太多？


      常有人这么说。可这多可笑啊，科学不就是不断追问嘛！


      我决定先把图表发给玛格达莱娜，然后再按主管要求删除。


      ------------------

