content_container:
- contents:
  - widget_type: CodexText
    text: <link="BATTERYMEDIUM">巨型蓄电池</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 电力调节
    style: Body
    image: research_type_alpha_icon
    link_id: powerregulation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: batterymed_0__ui
