- contents:
  - widget_type: CodexText
    text: >+
      [录音开始]


      不可思议……


      ……它们似乎还残存着被歌声抚慰的远古记忆。


      或许，它们与我们自己的生物有着超乎想象的共通之处。


      [录音结束]


