  - widget_type: CodexDividerLine
  - widget_type: CodexText
    text: >-
      露饵花是可以捕捉飞行小动物，比如<link="MOSQUITO">蚋虱</link>，的食肉植物。


      露饵花的消化过程会产生可收获的<link="AMBER">琥珀</link>。
    style: Body
