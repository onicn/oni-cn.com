          • 生长周期：12.0周期
          • <link="HEAT">温度</link>：10至55ºC
          • <link="ATMOSPHERE">气压</link>：最低150克
          • 农地
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
