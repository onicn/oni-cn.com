- contents:
  - widget_type: CodexText
    text: >-
      露饵花是一种肉食性花卉，其丝带状的蕊丝能感知捕猎范围内飞行小动物的存在。


      这种植物的花瓣表面覆满纤细的中空绒毛，可固定猎物并确保消化酶均匀分布。唯一无法被其完全消化的部分是小动物的外骨骼，这些残骸会刺激花朵的黏膜。


      液化的外骨骼残骸会按需排出。
    style: Body
  layout: Vertical
