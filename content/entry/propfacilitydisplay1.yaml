    text: >-
      最新的3D打印技术现已推出：

      庄严科技家用打印舱


      我们很自豪地宣布，庄严科技改进了打印技术，很快，它将给您的现有家用打印舱带来新的生物有机材料打印功能。


      这对普通家庭意味着什么？


      您再也不必为晚餐发愁！只需选择打印舱5398种预编程食谱中的任意一种，您便可在0.87秒后开始享用美味的炖肉。


      更喜欢独有的家庭食谱？您可以编写自己的食谱，即刻感受家的味道，或者走老派路线，打印新鲜美味的食材，自制美食。


      晚餐就是这么容易！
