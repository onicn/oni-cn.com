content_container:
- contents:
  - widget_type: CodexText
    text: <link="ALGAEDISTILLERY">藻类蒸馏器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 精馏
    style: Body
    image: research_type_alpha_icon
    link_id: distillation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: algae_distillery_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 将<link="SLIMEMOLD">菌泥</link>提炼为<link="ALGAE">藻类</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="SLIMEMOLD">菌泥</link>：600克/秒'
    tooltip: 使用时消耗<style="consumed">600克/秒</style><style="KKeyword"><link="SLIMEMOLD">菌泥</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="ALGAE">藻类</link>：200克/秒'
    tooltip: >-
      使用时产生<style="produced">200克/秒</style><style="KKeyword"><link="ALGAE">藻类</link></style>


      输出温度至少为<b>30ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DIRTYWATER">污染水</link>：400克/秒'
    tooltip: >-
      使用时产生<style="produced">400克/秒</style><style="KKeyword"><link="DIRTYWATER">污染水</link></style>


      输出温度至少为<b>30ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1.5千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1.5千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>藻类蒸馏器将容易致病的菌泥变成藻类，以供氧气生产。</i>
    style: Body
  layout: Vertical
