- contents:
  - widget_type: CodexText
    text: 帕库鱼眼睛一眨不眨的，因此往往被认为目光呆滞，不过这种生物还是极为聪明、友善。
    style: Body
  - widget_type: CodexText
    text: 虽然是从帕库鱼演变而来，但无论在遗传学还是行为学上，大嘴鱼都是独一无二的，足以视为一种独特的亚种。
    style: Body
  - widget_type: CodexText
    text: 有记录显示，帕库鱼的平均智商与狗相当，它们能够记住和分辨超过20张人脸。
    style: Body
  layout: Vertical
