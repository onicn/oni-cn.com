    text: >
      <smallcaps>收件人：<b>哈罗德P.莫尔森博士</b><alpha=#AA><size=12> <hmoreson@gravitas.nova></size></color>

      发件人：<b>迪伦·廷布尔博士</b><alpha=#AA><size=12> <principal@brighthall.edu></size></color></smallcaps>

      ------------------
    style: Body
  layout: Vertical
