- contents:
  - widget_type: CodexText
    text: 将<link="ELECTROBANK">移动电源</link>中储存的能量转化为电力以供相连的建筑使用。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x1格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>100千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：+60瓦'
    tooltip: 为相连的<style="KKeyword">电路</style>产生<style="produced">60瓦</style>电力
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+625复制热/秒'
    tooltip: >-
      每秒产生<style="produced">625复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>一种小型独立电力中心，可以装在地面或墙体上。</i>
