- contents:
  - widget_type: CodexText
    text: 使用<link="DIRTYWATER">污染水</link>和<link="PHOSPHORITE">磷矿</link>生产<link="FERTILIZER">肥料</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="DIRTYWATER">污染水</link>：39克/秒'
    tooltip: 使用时消耗<style="consumed">39克/秒</style><style="KKeyword"><link="DIRTYWATER">污染水</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DIRT">泥土</link>：65克/秒'
    tooltip: 使用时消耗<style="consumed">65克/秒</style><style="KKeyword"><link="DIRT">泥土</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="PHOSPHORITE">磷矿</link>：26克/秒'
    tooltip: 使用时消耗<style="consumed">26克/秒</style><style="KKeyword"><link="PHOSPHORITE">磷矿</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输入管道</link>'
    tooltip: 必须从<link="LIQUIDCONDUIT">液体管道</link>系统中接收<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：4格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="METHANE">天然气</link>：10克/秒'
    tooltip: >-
      使用时产生<style="produced">10克/秒</style><style="KKeyword"><link="METHANE">天然气</link></style>


      输出温度为<b>76ºC</b>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="FERTILIZER">肥料</link>：120克/秒'
    tooltip: >-
      使用时产生<style="produced">120克/秒</style><style="KKeyword"><link="FERTILIZER">肥料</link></style>


      输出温度至少为<b>50ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+3千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">3千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>肥料合成器可将污染水变成肥料以便培育植物。</i>
    style: Body
  layout: Vertical
