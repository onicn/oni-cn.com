id: CRAFTINGTABLE
parent_id: BUILDCATEGORYEQUIPMENT
name: 工作台
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 工作台
content_container:
- contents:
  - widget_type: CodexText
    text: <link="CRAFTINGTABLE">工作台</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 职业管理
    style: Body
    image: research_type_alpha_icon
    link_id: jobs
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: craftingstation_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      为复制人生产可供使用的物品和装备。


      只有在队列中安排配方复制人才会进行制作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：60瓦'
    tooltip: 必须与至少有<style="consumed">60瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>工作台可以让复制人制作在低氧区域穿戴的氧气面罩。</i>
    style: Body
  layout: Vertical
