- contents:
  - widget_type: CodexText
    text: <link="MILKFATSEPARATOR">咸乳蜡收集器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 咸乳供应
    style: Body
    image: research_type_alpha_icon
    link_id: dairyoperation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: milk_separator_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 将<link="MILK">咸乳</link>精炼为<link="BRINE">浓盐水</link>和<link="MILKFAT">咸乳蜡</link>，并释放<link="CARBONDIOXIDE">二氧化碳</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="MILK">咸乳</link>：1000克/秒'
    tooltip: 使用时消耗<style="consumed">1000克/秒</style><style="KKeyword"><link="MILK">咸乳</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输入管道</link>'
    tooltip: 必须从<link="LIQUIDCONDUIT">液体管道</link>系统中接收<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：4格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>800千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="MILKFAT">咸乳蜡</link>：90克/秒'
    tooltip: >-
      使用时产生<style="produced">90克/秒</style><style="KKeyword"><link="MILKFAT">咸乳蜡</link></style>


      输出温度为输入材料的混合<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="BRINE">浓盐水</link>：810克/秒'
    tooltip: >-
      使用时产生<style="produced">810克/秒</style><style="KKeyword"><link="BRINE">浓盐水</link></style>


      输出温度为输入材料的混合<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="CARBONDIOXIDE">二氧化碳</link>：100克/秒'
    tooltip: >-
      使用时产生<style="produced">100克/秒</style><style="KKeyword"><link="CARBONDIOXIDE">二氧化碳</link></style>


      输出温度至少为<b>75ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+8千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">8千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>复制人可以涂上一层咸乳蜡，以提高他们在运载管道中的前进速度。</i>
    style: Body
  layout: Vertical
