- contents:
  - widget_type: CodexText
    text: 这种炎热油滑的生态含有大量<link="DIRTYWATER">污染水</link>池，以及用于建立工业系统的原料。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      肉食性<link="FLYTRAPPLANT">露饵花</link>会捕捉飞行小动物，比如讨厌的<link="MOSQUITOSPECIES">蚋虱</link>，并产生可转化为<link="NATURALRESIN">树脂</link>用于<link="POLYPROPYLENE">塑料</link>生产的<link="AMBER">琥珀</link>。本地植物还包括<link="KELPPLANT">海梳蕨</link>，可以加工成<link="PHYTOOIL">植物润滑油</link>。


      称为<link="PREHISTORICPACUSPECIES">颚鱼</link>的水生庞然大物会以<link="PACUSPECIES">帕库鱼</link>为猎物，并排出大块<link="RUST">铁锈</link>。
    style: Body
