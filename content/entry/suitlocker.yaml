id: SUITLOCKER
parent_id: BUILDCATEGORYEQUIPMENT
name: 气压服存放柜
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 气压服存放柜
content_container:
- contents:
  - widget_type: CodexText
    text: <link="SUITLOCKER">气压服存放柜</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 危险防护
    style: Body
    image: research_type_alpha_icon
    link_id: suits
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: changingarea_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      存放<link="ATMOSUIT">气压服</link>并为其补充<link="OXYGEN">氧气</link>。


      清空气压服中的<link="DIRTYWATER">污染水</link>。


      建在<link="SUITMARKER">气压服检查站</link>旁，使复制人在路过时换上气压服。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GASPIPING">气体输入管道</link>'
    tooltip: 必须从<link="GASCONDUIT">气体管道</link>系统中接收<style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>100千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：+10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内提高<b><b>+10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>气压服存放柜可为气压服排出废物，但是一次只能处理一件气压服。</i>
    style: Body
  layout: Vertical
