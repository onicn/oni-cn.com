    text: >-
      第三次工作纪念日快乐，阿达！


      我画这个是为了填补储物柜旁边的空间，你那贪吃的小动物上周把那片墙撕坏了。希望这够大了！


      我仍然无法相信它们居然能消化钢铁——还得是你知道怎么繁殖它们！


      - 利亚姆
