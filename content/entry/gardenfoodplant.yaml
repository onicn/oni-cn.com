  - widget_type: CodexText
    text: >-
      汗甜玉米秆是玉米属最古老的成员之一。


      这种健壮的单茎植物结有色彩艳丽、甜度极高的玉米，因而备受推崇。


      农民会把收获最好的一批送给其最珍视的邻居。一些词源学家推测，“老套”一词最初正是用来形容这些赠礼附带的卡片上真挚感人的话语。
    style: Body
