    text: '    改善建筑'
    tooltip: <style="KKeyword">调校</style>可以改善这些建筑：
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GENERATOR">煤炭发电机</link>'
    tooltip: <link="GENERATOR">煤炭发电机</link>
