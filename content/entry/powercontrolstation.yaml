- contents:
  - widget_type: CodexText
    text: >-
      生产<link="POWERSTATIONTOOLS">微芯片</link>以增加发电机输出的<link="POWER">电力</link>。


      分配的复制人必须具有<link="TECHNICALS2">调校</link>特质。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="REFINEDMETAL">精炼金属</link>：每次消耗5千克'
    tooltip: 每次使用消耗<style="consumed">5千克</style><style="KKeyword"><link="REFINEDMETAL">精炼金属</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    专用房间：发电厂'
    tooltip: >-
      必须建在专用<style="KKeyword">房间</style>内


      建成后，<style="KKeyword">房间</style>将变为<style="KKeyword">发电厂</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克'
