  - widget_type: CodexTextWithTooltip
    text: '    <link="HYDROGENGENERATOR">氢气发电机</link>'
    tooltip: <link="HYDROGENGENERATOR">氢气发电机</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="METHANEGENERATOR">天然气发电机</link>'
    tooltip: <link="METHANEGENERATOR">天然气发电机</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="PEATGENERATOR">泥炭燃烧器</link>'
    tooltip: <link="PEATGENERATOR">泥炭燃烧器</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="PETROLEUMGENERATOR">石油发电机</link>'
    tooltip: <link="PETROLEUMGENERATOR">石油发电机</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="STEAMTURBINE2">蒸汽涡轮机</link>'
