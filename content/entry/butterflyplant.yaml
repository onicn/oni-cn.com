- contents:
  - widget_type: CodexText
    text: >-
      拟芽是绝佳的伴生植物，能为农场带来益虫的种种好处，而无需应对额外的小动物管理的麻烦。


      每个紧裹的芽苞内，都蕴藏着一池高度浓缩的酶类物质和成虫盘，这与鳞翅目昆虫体内结构相似。


      在适宜条件下，这种独特的混合物将孕育出一只<link="BUTTERFLY">拟蛾</link>，这是一种短暂的类昆虫生物，在最终化为种子形态之前，能显著加速周边植物的生长。


      每当<link="BUTTERFLY">拟蛾</link>现身，总能令园丁惊叹不已。
    style: Body
  layout: Vertical
