  - widget_type: CodexText
    text: >-
      拟芽是一种自收植物，能够产生飞行的<link="BUTTERFLY">拟蛾</link>。


      <link="BUTTERFLY">拟蛾</link>在硬化成<link="BUTTERFLYPLANT">拟种</link>之前可以加速附近<link="PLANTS">植物</link>的生长。
    style: Body
  - widget_type: CodexText
    text: >-
      <b>生长需求</b>：
          • 最大<link="RADIATION">辐射</link>：7,400拉德/周期
          • 生长周期：5.0周期
          • <link="HEAT">温度</link>：10至45ºC
          • <link="ATMOSPHERE">气压</link>：最低150克
          • <link="ATMOSPHERE">环境</link>：
              • <link="OXYGEN">氧气</link>
              • <link="CONTAMINATEDOXYGEN">污染氧</link>
              • <link="CARBONDIOXIDE">二氧化碳</link>
              • <link="CHLORINEGAS">氯气</link>
          • <link="DIRT">泥土</link>：-10千克/周期
          • 农地
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <b>效果</b>：
          • <link="BUTTERFLY">拟蛾</link>：1
          • <link="DECOR">装饰度</link>：+15（范围：2格）
