- contents:
  - widget_type: CodexText
    text: >-
      狐鹿是没有敌意的小动物，吃<link="PRICKLEFLOWER">毛刺花</link>和<link="HARDSKINBERRY">刺壳果</link>。


      狐鹿的角长成时，会硬化为可修剪的<link="WOOD">木材</link>。
    style: Body
  layout: Vertical
