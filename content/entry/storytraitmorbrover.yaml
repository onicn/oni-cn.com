- contents:
  - widget_type: CodexText
    text: 挑战完成
    style: Title
  - widget_type: CodexText
    text: >-
      成功了！我的复制人让生机组构仪启动并运行的努力终于获得了回报！


      我们第一台完全组装的P.E.G.G.Y.生物机器人已经准备好前往危险环境执行任务了，这意味着我能减少复制人暴露在危险中的情况。我们能生产生物机器人的数量似乎没有限制。


      在孢体缸后面发现了一个小型玩具机器人。它偶尔会播放音质不良的笑声。
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
  lock_id: story_trait_morbrover_complete
- contents:
  - widget_type: CodexText
    text: <link="STORYTRAITMORBROVER">生物机器人</link>
    style: Title
  - widget_type: CodexText
    text: >-
      病原体驱动的引导机器人通过满足以下三个核心效果，使殖民地在恶劣环境的生存几率最大化：


      1. 过滤并移除环境中的毒素。

      2. 通过将毒素转化为可用的生物燃料，将其安全处理。

      3. 为殖民地扩建提供地质勘探设备，使殖民地的危险最小化。


      在此过程中聚集的毒素可能会不经意地传播。需要特殊训练才能安全处理。
    style: Body
  - widget_type: CodexImage
    image: MorbRover_image
  - widget_type: CodexText
    text: >-
      一台病原体驱动的舱外地质勘探引导机器人（Y型），又称“P.E.G.G.Y.”。


      可以在危险环境中为其分配基本的建造和挖掘任务。
    style: Body
