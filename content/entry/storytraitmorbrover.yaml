- contents:
  - widget_type: CodexText
    text: 初遇
    style: Title
  - widget_type: CodexText
    text: >-
      我的复制人发现了满是蒙尘机械的实验室。也许是另一个殖民地实验的遗迹？


      目前还不清楚这些仪器是用于生物实验，还是用于高级机电一体化技术……亦或者都是。
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
  lock_id: story_trait_morbrover_initial
- contents:
  - widget_type: CodexText
    text: 遇见P.E.G.G.Y.
    style: Title
  - widget_type: CodexText
    text: >-
      我们的恢复工作已经完成了！


      在此建筑的机械装配缸上有一小块匾牌，上面写着：“病原体驱动的舱外地质勘探引导机器人（Y型）。”


      相邻的水缸里装着浮动的东西，样子像是半成型的生物体。其鲜艳的颜色让我想起我们母星丛林上被灭除的有毒两栖生物。


      杂乱之中有一份破旧的打印本，已被收回。
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
  lock_id: story_trait_morbrover_reveal
- contents:
  - widget_type: CodexText
    text: 加密级别：三
    style: Title
  - widget_type: CodexText
    text: >-
      <smallcaps>[检测到录音片段]

      [声纹识别系统不可用]</smallcaps>


      [录音开始]


      ……然后打印舱说“叩叩，糊在家！”


      呃。他们不会嘲笑<i>那</i>家伙的。


      如果——


      （叮当声）


      嘿，嘿，粘糊糊的小家伙！看看你都长多大了。你准备好乘坐大机器人了吗？赛义德·阿利博士开完会随时都会回来。他看到你会很高兴的。


      （潮湿地拍打玻璃声）


      啊是的，我也会不耐烦的。


      你猜怎么着，为什么我不直接带你去新家呢？我帮他做这活了不下十次了。


      “看一次，做一次，教一次”，对吧？


      [录音结束]
    style: Body
  layout: Vertical
  lock_id: story_trait_morbrover_reveal_lore
- contents:
  - widget_type: CodexText
    text: 匿名爱慕者
    style: Title
  - widget_type: CodexText
    text: "我是\n   一粒亚原子\n比一颗灰尘还要小\n  在洗眼站从你的注视中\n\n     被冲走了  \n\n   我的爱就像钚\n 灰色又暗淡\n难以承受的重\n  直到    我在你身边\n\n 每一次呼吸 \n      我都燃烧着\n    看不见的\n              渴望\n\n附言：我让史蒂夫让我进去了，所以我能把这个留给你，希望你能喜欢。"
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
  lock_id: story_trait_morbrover_locker
- contents:
  - widget_type: CodexText
    text: 遗憾于身
    style: Title
  - widget_type: CodexText
    text: >-
      赛义德·阿利博士，


      你生我的气是对的。我<i>就是</i>无人驾驶机器人项目被重新分配的原因。斯特恩主管把我叫了过去，讨论了你关于孢体粘蛋白交叉污染的担忧，然后我……


      她说，X型的补充测试对谷神星任务产生了威胁。


      在什么发生在那个可怜的实验室技术员身上之后，我应该再说点什么的，但是……


      对他来说已经太晚了。


      可能对我们所有人来说都太晚了。


      你应该知道，我前脚刚离开，主管就收到了来自顶点研究所的某人发来的视频电话……我徘徊在她门外，听到她称呼他们为跨国安全负责人！当谈论到生物机器人，他们的说话方式就像……


      在这里再写下去就不安全了。今晚下班后我在火箭机库等你。


      我希望你能来。你不来我也能理解。


      我非常非常抱歉。


      - 猿桥博士
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
