- contents:
  - widget_type: CodexText
    text: >
      <smallcaps>[检测到录音片段]

      [声纹识别系统不可用]</smallcaps>


      [录音开始]


      ……要求饥饿的殖民地在将可食用作物用于维持生计和电力生产之间做出选择是否有悖人伦？当然不是。


      我们的任务是提供尽可能多的生存选择，而不是规定哪些选择在道德上更优越。


      真正的问题是人工智能的指导是否足够先进，能够告知他们选择是存在的……


      ……以及由于极端热失控而蒸发的一次性生物移动电源是否真的会在成功的殖民地和……<i>没成功的</i>……殖民地之间有实际区别。


      [录音结束]

      ------------------
