    text: 太空生态位于小行星的表面。要小心从天而降的耀眼流星。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 在地表建立<link="SOLARPANELS">太阳能板</link>可以提供可再生能源。然而，需要注意确保<link="ELEMENTSLIQUID">液体</link>和<link="ELEMENTSGAS">气体</link>不会被吸入太空的<link="VACUUM">真空</link>中。<link="MOLE">锹环田鼠</link>是这片生态的原始物种，需要捕捉或者控制否则会侵扰殖民地。
    style: Body
