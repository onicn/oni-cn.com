      熔点：799.9ºC

      硬度：<color=#71ABCFFF>5（非常柔软）</color>


      比热容：0.700 (DTU/g)/ºC

      热导率：0.444 (DTU/(m*s))/ºC

      辐射吸收因数：0.75

      辐射释放量/1000千克：0拉德/周期


