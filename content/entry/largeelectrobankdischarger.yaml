  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：+480瓦'
    tooltip: 为相连的<style="KKeyword">电路</style>产生<style="produced">480瓦</style>电力
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1.25千复制热/秒'
