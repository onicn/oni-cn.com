      硬度：<color=#6D7BC1FF>10（柔软）</color>


      比热容：0.830 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.7

      辐射释放量/1000千克：0拉德/周期


      属性：<link="COMPOSTABLE">可堆肥物</link>, <link="ELEMENTSSOLID">固体</link>, 有机物

