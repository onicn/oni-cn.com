id: ADVANCEDDOCTORSTATION
parent_id: BUILDCATEGORYMEDICAL
name: 病诊站
disabled: False
search_only: False
category: BUILDCATEGORYMEDICAL
sort_string: 病诊站
content_container:
- contents:
  - widget_type: CodexText
    text: <link="ADVANCEDDOCTORSTATION">病诊站</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 靶向药物
    style: Body
    image: research_type_alpha_icon
    link_id: medicineiv
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: bed_medical_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      允许复制人向生病的复制人施用强力药物。


      复制人必须具有高级医疗护理<link="ROLES">技能</link>才能治疗同伴。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="MEDICINE3">高级医疗护理</link>技能或<link="BOOSTERMEDICINE1">高级医疗增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    优选房间：医院'
    tooltip: 建造在<style="KKeyword">医院</style>内时，这个建筑会获得额外的效果或功能
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+750复制热/秒'
    tooltip: >-
      每秒产生<style="produced">750复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSCLINIC">医疗设备</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>病诊站需要电力，但能治疗比医务站更严重的疾病。</i>
    style: Body
  layout: Vertical
