- contents:
  - widget_type: CodexText
    text: <indent=5%>哦，如果你了解他的话就会知道，他人真的很好，很可靠。有一次，我把自己办公椅上的轮子撞坏了一个，他很快给我拿来个新的，估计前后只有两分钟。我觉得，他应该只是因为工作太努力，弄得满身汗味而已。</indent>
    style: Body
  - widget_type: CodexText
