id: MILKINGSTATION
parent_id: BUILDCATEGORYEQUIPMENT
name: 挤奶站
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 挤奶站
content_container:
- contents:
  - widget_type: CodexText
    text: <link="MILKINGSTATION">挤奶站</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 咸乳供应
    style: Body
    image: research_type_alpha_icon
    link_id: dairyoperation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: milking_station_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      允许具有<link="RANCHING2">小动物养殖 II</link>技能的复制人为<link="MOO">释气海牛</link>挤奶以获取<link="MILK">咸乳</link>。


      <link="MILK">咸乳</link>可用于补充<link="MILKFEEDER">小动物直饮器</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="RANCHING2">小动物养殖 II</link>技能或<link="BOOSTERRANCH1">养殖增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    专用房间：畜舍'
    tooltip: >-
      必须建在专用<style="KKeyword">房间</style>内


      建成后，<style="KKeyword">房间</style>将变为<style="KKeyword">畜舍</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：60秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>400千克, <link="PLASTIC">塑料</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSRANCHSTATIONTYPE">养殖建筑</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>收获来的这种液体基本上相当于小动物的苏打水。</i>
    style: Body
  layout: Vertical
