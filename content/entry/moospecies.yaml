    text: 可驯化的小动物
    style: Subtitle
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      由于其外星性质和起源，目前人们对释气海牛知之甚少。


      它能够在没有空气的零重力环境中生存，而且依赖于另一种外星物种<link="GASGRASS">释气草</link>以维持生存。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 释气海牛性情温和，可以饲养以获得天然气，但它们的繁殖方式尚未被发现。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexSpacer
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: gassy_moo_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      释气海牛是一种以<link="GASGRASS">释气草</link>为食的外星小动物，会排泄<link="METHANE">天然气</link>。


      当驯化并喂食后，为其挤奶可获得<link="MILK">咸乳</link>。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 理想温度
    style: Subtitle
  - widget_type: CodexText
    text: '    • 舒适范围：<b>-50ºC</b>至<b>50ºC</b>'
    style: Body
  - widget_type: CodexText
    text: '    • 存活范围：<b>-200ºC</b>至<b>200ºC</b>'
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 寿命
    style: Subtitle
  - widget_type: CodexText
    text: 这种小动物特征<link="CREATURES__GUIDE__FERTILITY">寿命</link>为<b>75周期</b>。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 所需空间
    style: Subtitle
  - widget_type: CodexText
    text: '    • 当房间空间对每只小动物平均少于<b>16格</b>时会感到<link="CREATURES__GUIDE__MOOD">拥挤</link>。'
    style: Body
  - widget_type: CodexText
    text: '    • 当房间小于<b>16格</b>时会感到<link="CREATURES__GUIDE__MOOD">封闭</link>。'
