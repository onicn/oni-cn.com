- contents:
  - widget_type: CodexText
    text: >-
      绒犸兔是记录以来最古老的物种，其古老的遗骸可追溯到大约10,000年前。


      这种平静的食草动物因其独特的肢体语言而出名：一只愤怒的青年绒犸兔会通过在对手面前戏剧性地摔倒表达不满，而行动不便的年长绒犸兔会背对着引起它烦恼的来源坐着。


      在看护者面前舔舐地面可能是其深厚感情的表现，也可能是缺乏矿物质的表现。
    style: Body
  layout: Vertical
