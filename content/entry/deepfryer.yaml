- contents:
  - widget_type: CodexText
    text: >-
      使用<link="TALLOW">动物油脂</link>烹饪种类繁多的改良<link="FOOD">食物</link>。


      只有在队列中安排配方复制人才会进行制作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="COOKING1">烧烤</link>技能或<link="BOOSTERCOOK1">烧烤增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    专用房间：厨房'
    tooltip: >-
      必须建在专用<style="KKeyword">房间</style>内


      建成后，<style="KKeyword">房间</style>将变为<style="KKeyword">厨房</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    精制：'
    tooltip: 将原材料加工成精制材料
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="FRIESCARROT">果薯条</link>'
    tooltip: >
      原料：

      • 1单位<link="CARROT">羽叶果薯</link>

      • 1单位<link="TALLOW">动物油脂</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DEEPFRIEDNOSH">炸豆小吃</link>'
    tooltip: >
      原料：

      • 6单位<link="BEAN">小吃豆</link>

      • 1单位<link="TALLOW">动物油脂</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DEEPFRIEDFISH">鱼肉卷</link>'
    tooltip: >
      原料：

      • 1单位<link="FISHMEAT">帕库鱼片</link>

      • 2.4单位<link="TALLOW">动物油脂</link>

      • 2单位<link="COLDWHEAT">冰霜麦粒</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DEEPFRIEDFISH">鱼肉卷</link>'
    tooltip: >
