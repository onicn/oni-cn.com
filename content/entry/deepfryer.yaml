      • 1单位<link="SHELLFISHMEAT">生蟹肉</link>

      • 2.4单位<link="TALLOW">动物油脂</link>

      • 2单位<link="COLDWHEAT">冰霜麦粒</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DEEPFRIEDSHELLFISH">蟹肉天妇罗</link>'
    tooltip: >
      原料：

      • 1单位<link="SHELLFISHMEAT">生蟹肉</link>

      • 2.4单位<link="TALLOW">动物油脂</link>

      • 2单位<link="FERNFOOD">巨蕨谷粒</link>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    杀死病菌'
    tooltip: 烹饪过程能杀死所有存在于食物原料上的<style="KKeyword">病菌</style>，从而防止吃东西时产生<style="KKeyword">疾病</style>风险
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+10千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">10千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSCOOKTOP">烹饪站</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>油炸的东西味道更好。</i>
    style: Body
  layout: Vertical
