      熔点：1063.9ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：0.150 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.3

      辐射释放量/1000千克：0拉德/周期


      属性：矿石, <link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, <link="METAL">金属矿石</link>

      <style="KKeyword">装饰</style>：+10%

      <style="KKeyword">过热温度</style>：+50ºC
