      <indent=5%>主管，


      我对如何解决复制人记忆问题有一个想法。


      与其尝试激活实验体的旧记忆，我们不如把在殖民地生存的所有必需信息融入打印过程之中？


      近年来，数据工程可储存的数据量呈指数级增长。我们应该充分利用技术发展带来的这一优势。</indent>
