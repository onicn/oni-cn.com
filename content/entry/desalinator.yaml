- contents:
  - widget_type: CodexText
    text: 从<link="BRINE">浓盐水</link>或<link="SALTWATER">盐水</link>中移除<link="SALT">盐</link>，产生<link="WATER">水</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="SALTWATER">盐水</link>：5千克/秒'
    tooltip: 使用时消耗<style="consumed">5千克/秒</style><style="KKeyword"><link="SALTWATER">盐水</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="BRINE">浓盐水</link>：5千克/秒'
    tooltip: 使用时消耗<style="consumed">5千克/秒</style><style="KKeyword"><link="BRINE">浓盐水</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输入管道</link>'
    tooltip: 必须从<link="LIQUIDCONDUIT">液体管道</link>系统中接收<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexSpacer
