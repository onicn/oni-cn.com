      使用时产生<style="produced">4650克/秒</style><style="KKeyword"><link="WATER">水</link></style>


      输出温度为输入材料的混合<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="SALT">盐</link>：350克/秒'
    tooltip: >-
      使用时产生<style="produced">350克/秒</style><style="KKeyword"><link="SALT">盐</link></style>


      输出温度为输入材料的混合<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="WATER">水</link>：3500克/秒'
    tooltip: >-
      使用时产生<style="produced">3500克/秒</style><style="KKeyword"><link="WATER">水</link></style>


      输出温度为输入材料的混合<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="SALT">盐</link>：1500克/秒'
    tooltip: >-
      使用时产生<style="produced">1500克/秒</style><style="KKeyword"><link="SALT">盐</link></style>


