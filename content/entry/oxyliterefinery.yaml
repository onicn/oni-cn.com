    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GOLD">金</link>：3000毫克/秒'
    tooltip: 使用时消耗<style="consumed">3000毫克/秒</style><style="KKeyword"><link="GOLD">金</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：1.2千瓦'
    tooltip: 必须与至少有<style="consumed">1.2千瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
