    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：480秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>800千克, <link="PLASTIC">塑料</link>100千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="OXYROCK">氧石</link>：600克/秒'
    tooltip: >-
      使用时产生<style="produced">600克/秒</style><style="KKeyword"><link="OXYROCK">氧石</link></style>


      输出温度至少为<b>30ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+12千复制热/秒'
