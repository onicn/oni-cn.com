- contents:
  - widget_type: CodexText
    text: 使用<link="OXYGEN">氧气</link>和少量的<link="GOLD">金</link>合成<link="OXYROCK">氧石</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="OXYGEN">氧气</link>：600克/秒'
