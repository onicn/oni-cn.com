content_container:
- contents:
  - widget_type: CodexText
    text: <link="RUSTDEOXIDIZER">铁锈脱氧机</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 空气系统
    style: Body
    image: research_type_alpha_icon
    link_id: improvedoxygen
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: rust_deoxidizer_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      将<link="RUST">铁锈</link>转化为<link="OXYGEN">氧气</link>和<link="CHLORINE">氯气</link>。


      当区域的气压达到最大时将会闲置。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="RUST">铁锈</link>：750克/秒'
    tooltip: 使用时消耗<style="consumed">750克/秒</style><style="KKeyword"><link="RUST">铁锈</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="SALT">盐</link>：250克/秒'
    tooltip: 使用时消耗<style="consumed">250克/秒</style><style="KKeyword"><link="SALT">盐</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：60瓦'
    tooltip: 必须与至少有<style="consumed">60瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="OXYGEN">氧气</link>：570克/秒'
    tooltip: >-
      使用时产生<style="produced">570克/秒</style><style="KKeyword"><link="OXYGEN">氧气</link></style>


      输出温度至少为<b>75ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="CHLORINEGAS">氯气</link>：30克/秒'
    tooltip: >-
      使用时产生<style="produced">30克/秒</style><style="KKeyword"><link="CHLORINEGAS">氯气</link></style>


      输出温度至少为<b>75ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="IRONORE">铁矿</link>：400克/秒'
    tooltip: >-
      使用时产生<style="produced">400克/秒</style><style="KKeyword"><link="IRONORE">铁矿</link></style>


      输出温度至少为<b>75ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1.13千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1.13千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>一端进入铁锈和盐，另一端出来氧气。</i>
    style: Body
  layout: Vertical
