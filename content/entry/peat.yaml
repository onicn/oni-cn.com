- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      泥炭是一种由部分分解的有机物组成的致密堆积材料。


      它是一种可燃燃料，可用于生产<link="POWER">电力</link>。


      资源种类：消耗性矿石

      熔点：226.9ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：0.710 (DTU/g)/ºC

      热导率：0.600 (DTU/(m*s))/ºC

      辐射吸收因数：0.75

      辐射释放量/1000千克：0拉德/周期


      属性：<link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, 消耗性矿石
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
