id: LIQUIDRESERVOIR
parent_id: BUILDCATEGORYBASE
name: 储液库
disabled: False
search_only: False
category: BUILDCATEGORYBASE
sort_string: 储液库
content_container:
- contents:
  - widget_type: CodexText
    text: <link="LIQUIDRESERVOIR">储液库</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 改良水管
    style: Body
    image: research_type_alpha_icon
    link_id: improvedliquidpiping
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: liquidreservoir_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 储存任何经管道输送的<link="ELEMENTSLIQUID">液体</link>资源。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输入管道</link>'
    tooltip: 必须从<link="LIQUIDCONDUIT">液体管道</link>系统中接收<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    库存容量：5吨'
    tooltip: 最多容纳<b>5吨</b>材料
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    补存参数'
    tooltip: >-
      输出端行为：

      • 当储量低于<b>下限阈值</b>时输出<b><style="logic_on">绿色信号</style></b>，直到再次到达<b>上限阈值</b>为止

      • 当储量超过<b>上限阈值</b>时输出<b><style="logic_off">红色信号</style></b>，直到再次到达<b>下限阈值</b>为止
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>储液库无法接收手动运送的资源。</i>
    style: Body
  layout: Vertical
