    text: >-
      <indent=5%>你好，琼斯博士，


      希望你身体健康。很抱歉打扰你——但我相信有人不正当地访问了我的电脑。


      当我早上登陆的时候，“上次登陆”弹窗显示我的电脑在早上2点被访问过。我上次实际登陆是在下午6点，而且我的一些文件不见了。


      我的工作隐私是十分重要的。所以能请人帮忙看一下吗？</indent>
    style: Body
  - widget_type: CodexText
    text: >2

      - 奥洛博士

      <size=11>工业与组织心理学家

      庄严科技</size>

