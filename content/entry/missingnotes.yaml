- contents:
  - widget_type: CodexText
    text: >-
      <indent=5%>亲爱的琼斯博士，

      我很抱歉再次打扰你……但我十分确定就是有人干预了我的文件。


      自从上周的“小故障”以来，我注意到好几处异样。比如最近的员工工作满意度和安全性的调查，我对此的回应被解密了，我的数据和研究记录的很大一部分都被清除了。我甚至还少了几封电子邮件。


      这一切都令我担忧。能请你或苏梅尔斯博士有时间调查一下吗？


      非常感谢。


      </indent>
    style: Body
  - widget_type: CodexText
    text: >2

      - 奥洛博士

      <size=11>工业与组织心理学家

      庄严科技</size>

      ------------------
