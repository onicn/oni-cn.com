- contents:
  - widget_type: CodexText
    text: >-
      虫果芽与<link="DIVERGENTSPECIES">异化虫</link>类表现出共进化关系。


      虽然虫果芽在没有异化虫帮助的情况下也能产生果实，但<link="WORMPLANT">贫瘠虫果</link>是次级版本的虫果，没有与虫果相同的味道和卡路里值。


      关于异化虫如何激发虫果芽生长的机制尚未全部为人所知，但在某种程度上可以认为与这些昆虫对植物亲切地咕咕叫的次声“曲调”有关。
    style: Body
  layout: Vertical
