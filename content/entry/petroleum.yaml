- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      石油是一种<link="POWER">电力</link>来源，通过提炼<link="CRUDEOIL">原油</link>获得。


      它也是生产<link="POLYPROPYLENE">塑料</link>所需的重要原料。


      资源种类：<link="ELEMENTSLIQUID">液体</link>

      冰点：-57.1ºC

      沸点：538.9ºC


      比热容：1.760 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.8

      辐射释放量/1000千克：0拉德/周期


      属性：<link="COMBUSTIBLELIQUID">可燃液体</link>, <link="PLASTIFIABLELIQUID">塑料单体</link>, <link="ELEMENTSLIQUID">液体</link>
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
