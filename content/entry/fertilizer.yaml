      肥料是一种经过处理的生物营养混合物。


      它有助于某些<link="PLANTS">植物</link>的生长。


      资源种类：<link="AGRICULTURE">农业</link>

      熔点：125ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：0.830 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.7

      辐射释放量/1000千克：0拉德/周期


      属性：氧化剂, <link="ELEMENTSSOLID">固体</link>, <link="AGRICULTURE">农业</link>
    style: Body
