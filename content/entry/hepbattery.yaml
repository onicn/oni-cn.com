id: HEPBATTERY
parent_id: BUILDCATEGORYHEP
name: 辐射粒子蓄存器
disabled: False
search_only: False
category: BUILDCATEGORYHEP
sort_string: 辐射粒子蓄存器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="HEPBATTERY">辐射粒子蓄存器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 辐射粒子控制
    style: Body
    image: research_type_alpha_icon
    link_id: nuclearstorage
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: radbolt_battery_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      储存高能量状态的辐射粒子以便传输。


      当达到辐射粒子阈值时，需要<b><style="logic_on">绿色信号</style></b>释放存储中的辐射粒子。


      储存的辐射粒子在建筑禁用时会快速衰减。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    辐射粒子输入口'
    tooltip: 这个建筑上的辐射粒子端口允许其接收<style="KKeyword">辐射粒子</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1.25千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1.25千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    辐射粒子输出口'
    tooltip: 这个建筑有一个可设置的辐射粒子端口，用于释放<style="KKeyword">辐射粒子</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    不发射辐射粒子'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：发射辐射粒子

      • <b><style="logic_off">红色信号</style></b>：不发射辐射粒子
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    辐射粒子库存'
    tooltip: >-
      输出端行为：

      • 当库存充满辐射粒子时，输出<b><style="logic_on">绿色信号</style></b>

      • 否则，输出<b><style="logic_off">红色信号</style></b>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>粒子就绪，准备发射。</i>
    style: Body
  layout: Vertical
