id: WOODGASGENERATOR
parent_id: BUILDCATEGORYPOWER
name: 木材燃烧器
disabled: False
search_only: False
category: BUILDCATEGORYPOWER
sort_string: 木材燃烧器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="WOODGASGENERATOR">木材燃烧器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 内燃机
    style: Body
    image: research_type_alpha_icon
    link_id: combustion
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: generatorwood_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      燃烧<link="WOOD">木材</link>以产生<link="POWER">电力</link>。


      产生<link="CARBONDIOXIDE">二氧化碳</link>和<link="HEAT">热量</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="WOODLOG">木材</link>：1200克/秒'
    tooltip: 使用时消耗<style="consumed">1200克/秒</style><style="KKeyword"><link="WOODLOG">木材</link></style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>800千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="CARBONDIOXIDE">二氧化碳</link>：170克/秒'
    tooltip: >-
      使用时产生<style="produced">170克/秒</style><style="KKeyword"><link="CARBONDIOXIDE">二氧化碳</link></style>


      输出温度至少为<b>110ºC</b>，如果建筑的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：+300瓦'
    tooltip: 为相连的<style="KKeyword">电路</style>产生<style="produced">300瓦</style>电力
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+9千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">9千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSPOWERBUILDING">电力建筑</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSGENERATORTYPE">发电机</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSGENERATORTYPE">重型发电机</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>木材燃烧器很小而且很容易维护，但会产生相当多的热量。</i>
    style: Body
  layout: Vertical
