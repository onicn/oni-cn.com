    style: Subtitle
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 树鼠是一种啮齿类动物，具有很强的匿藏本能，这使得它们会寻找并掩埋一些小物品，通常是种子。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 由于树鼠依靠树皮和木头生存，所以它们的匿藏行为是一种欲望还是一种娱乐形式目前还不得而知。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 尽管树鼠没有真正的对生拇指，但它灵巧的爪子可以让它在最狭窄的地方寻找种子和其他宝物。
    style: Body
  layout: Vertical
- contents:
