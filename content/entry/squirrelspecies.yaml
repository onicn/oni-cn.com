- contents:
  - widget_type: CodexText
    text: >-
      毛绒树鼠是毛茸茸的、充满关爱的小动物，对于所有种类的蛋都会展现强烈的拥抱本能。


      当被经过的复制人拥抱时，它会暂时增强情感。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 理想温度
    style: Subtitle
  - widget_type: CodexText
    text: '    • 舒适范围：<b>10ºC</b>至<b>40ºC</b>'
    style: Body
  - widget_type: CodexText
    text: '    • 存活范围：<b>-45ºC</b>至<b>100ºC</b>'
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 寿命
    style: Subtitle
  - widget_type: CodexText
    text: 这种小动物特征<link="CREATURES__GUIDE__FERTILITY">寿命</link>为<b>100周期</b>。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 所需空间
    style: Subtitle
  - widget_type: CodexText
    text: '    • 当房间空间对每只小动物平均少于<b>4格</b>时会感到<link="CREATURES__GUIDE__MOOD">拥挤</link>。'
    style: Body
  - widget_type: CodexText
    text: '    • 当房间小于<b>4格</b>时会感到<link="CREATURES__GUIDE__MOOD">封闭</link>。'
