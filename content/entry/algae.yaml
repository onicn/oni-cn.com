      资源种类：有机物

      熔点：125ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：0.200 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.65

      辐射释放量/1000千克：0拉德/周期


      属性：<link="ELEMENTSSOLID">固体</link>, 有机物
