id: SUITFABRICATOR
parent_id: BUILDCATEGORYEQUIPMENT
name: 太空服锻造台
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 太空服锻造台
content_container:
- contents:
  - widget_type: CodexText
    text: <link="SUITFABRICATOR">太空服锻造台</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 危险防护
    style: Body
    image: research_type_alpha_icon
    link_id: suits
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: suit_maker_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      为复制人制造可供穿戴的防护性<link="EQUIPMENT">太空服</link>。


      只有在队列中安排配方复制人才会进行制作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：4格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：240秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>复制人穿上充满氧气的太空服后可进入危险区域。</i>
    style: Body
  layout: Vertical
