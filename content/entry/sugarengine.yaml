- contents:
  - widget_type: CodexText
    text: >-
      燃烧<link="SUCROSE">蔗糖</link>以推动火箭进行太空探索。


      糖素引擎的高度限制比<link="CO2ENGINE">二氧化碳引擎</link>更宽松，但移动更慢。


      引擎必须通过<link="LAUNCHPAD">火箭平台</link>建造。


      建好引擎后，可以添加更多的火箭舱块。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
