- contents:
  - widget_type: CodexText
    text: 挑战完成
    style: Subtitle
  - widget_type: CodexText
    text: >-
      我的复制人已经找到这只巨型动物尽可能多的散落残骸，并进行了精心组装。


      通过努力，他们在最大化石的挖掘地点下发掘了一个看似无底的化石采集场。


      在最上方的骨头中间嵌着一个手工制作的小动物项圈。因为过大，它不应属于任何传统意义上的伴侣动物。
    style: Body
