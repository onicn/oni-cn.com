      ------------------
    style: Body
  layout: Vertical
  lock_id: story_trait_fossilhunt_poi2
- contents:
  - widget_type: CodexText
    text: >-
      <indent=5%>亲爱的[受屏蔽]


      我们很高兴地宣布，在皮亚齐行星行动（OPP）的研究目标已接近尾声。我们已经克服了这种开创性工作带来的前所未有的障碍，感谢大家的耐心。


      我们知道有传言说[受屏蔽]博士的文件中泄露了一些文档。


      请大家放心，所谓的“告密者”完全是捏造的——我们的技术远超一般水准，不允许出现OPP货物在目标日期前10,000年就到达其目的地的错误计算。


      我们的IT安全团队目前正在调查这份文档的数字痕迹以确定其来源。


      为了感谢大家的不断支持，我们想邀请主要利益相关者参加庄严科技举行的私人发布会。当晚将由奥莉维亚·布鲁萨德博士主持，她将展示我们开创性的原型体，以及用实验室制作的食材制成的五道菜。


      由于我们工作的敏感性，我们很抱歉目前无法容纳更多客人，并存在饮食限制。


      斯特恩主管在晚餐后将主持30分钟的问答环节。所有问题必须提前至少24小时提交。


      有关[受屏蔽]文件的问题将不予解答。


      请注意，此电子邮件的内容将在打开后3分钟后失效。</indent>
    style: Body
  - widget_type: CodexText
    text: >2

      谨上

      [受屏蔽]

      <size=11>庄严科技</size>

      ------------------
