    text: 远古标本
    style: Title
  - widget_type: CodexText
    text: >-
      这颗小行星的地下有一些骨架。


      搜寻一种远古小动物的化石碎片，以此收集庄严科技的历史并解锁新资源。
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 初遇
    style: Subtitle
  - widget_type: CodexText
    text: >-
      我发现了一只化石化的小动物埋藏在我的殖民地中——至少是其中一部分碎片——但它与我们在这颗小行星上发现的任何物种都不一样。


      它是从哪里来的？它是怎么到这里的？这些骨头藏着什么其他问题的解释呢？


      只有一种方法可以找到答案。
    style: Body
  - widget_type: CodexText
    text: ''
    style: Body
  layout: Vertical
  lock_id: story_trait_fossilhunt_initial
- contents:
  - widget_type: CodexText
    text: 生物体设计记录
    style: Subtitle
  - widget_type: CodexText
    text: 加密级别：三
    style: Body
  - widget_type: CodexText
    text: >
      <smallcaps>[声纹识别系统初始化完成]

      [识别编号：B363]</smallcaps>


      [录音开始]


      ……将我们的生物体设计做出特定目标的限制，使其在外行星极地气候中生存，以此大大缩小了我们的研究范围，使本项目的开发进度能迅速超过其他的项目。


      我们已经成功优化了适应性特征，比如形成的脂肪组织超过了生物体总质量的40%。布贝尔博士之前担心肌肉质量降低的问题，但最终确定减少量处于可接受范围内。


      我们的下一步是调整生物体的饮食。让这种大小的食肉生物加入新殖民地很不明智。


      [录音结束]

      ------------------

      [录音开始]


      ……当我独自一人在实验室时，我发现自己情不自禁地会去围栏听这种生物的旋律声。当我靠近时，它的音调有时会有稍微的变化。


      我不清楚这是什么意思。


      [录音结束]

      ------------------
    style: Body
  - widget_type: CodexText
    text: >
      [录音开始]


      ……其他部门的一些人把我们的工作称为“肉糕计划”。可以说是用词不当且十分粗鲁。这个物种的目标不是作为食物来源：它必须在谷神星的气候中生存足够长时间，建立稳定的种群，随后通过温斯洛博士革命性基因编码技术，安置组可以将储存在其DNA中的基本研究数据取出。


      想象一下，无数尧字节量的科学文档就在新殖民地周围自由徘徊……能自我维护的终极档案，能提供稳定的数据存储，不需要任何技术维护。


      它给予了“活的文档”新的含义。


      [录音结束]

      ------------------

      [录音开始]


      ……今天到日子了。我的“大嗓门”和她一小部分后代已准备好运送到新家了。它们计划三个月前到达，以确保在下周定居组到达前状态良好。


      特切纳博士邀请我协助传送任务，我因为太忙就没接受，为此也松了一口气，因为我听人说以前的货物出了岔子，虽然这些闲言碎语并没有得到证实，就目前为止吧……


      在我们任务的急迫性下有时还是得做一些不理想的妥协。


      现在实验室真是非常非常安静啊。


      [录音结束]

      ------------------
    style: Body
