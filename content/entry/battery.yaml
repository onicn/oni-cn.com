id: BATTERY
parent_id: BUILDCATEGORYPOWER
name: 蓄电池
disabled: False
search_only: False
category: BUILDCATEGORYPOWER
sort_string: 蓄电池
content_container:
- contents:
  - widget_type: CodexText
    text: <link="BATTERY">蓄电池</link>
    style: Title
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: batterysm_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      储存发电机产生的<link="POWER">电力</link>，然后向建筑提供电力。


      电量会随着时间流失。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    发<link="POWER">电</link>机'
    tooltip: 必须与<style="KKeyword">发电机</style>相连才能运作
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>容量：10千焦'
    tooltip: 与<style="KKeyword">发电机</style>连接后，可储存<b>10千焦</b>的<style="KKeyword">电力</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>泄露：1000.0焦/周期'
    tooltip: 这个蓄电池<style="consumed">1000.0焦/周期</style>的电量会作为<style="KKeyword">热量</style>散失
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1.25千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1.25千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSPOWERBUILDING">电力建筑</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>蓄电池可以将发电机产生的电量储存起来供以后使用。</i>
    style: Body
  layout: Vertical
