- contents:
  - widget_type: CodexText
    text: 初步扫描表明，这片生态没有<link="PLANTS">植物</link>或<link="CREATURES">小动物</link>。这里缺乏<link="ELEMENTSLIQUID">液体</link>，只有极少的<link="ELEMENTSGAS">气体</link>存在。这些干而充满尘土的平地可以挖来做建造材料，但对于一个殖民地来说，维持生存的资源很少。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      沉积岩层主要由<link="GRANITE">花岗岩</link>的沉积物组成，但也有<link="OBSIDIAN">黑曜石</link>和<link="IGNEOUSROCK">火成岩</link>存在。这表明了历史上火山的活动，尽管现在这里已经没有火山了。


      在初步扫描中也可以看出这里<link="IRON">铁矿</link>和<link="CARBON">煤炭</link>矿床很丰富。这两者对于建立殖民地的电力基础很有帮助。


      这里虽然缺少维持殖民地的关键的必要资源，但也没有什么危险能够伤害到我的复制人。这里对于探索来说足够安全。
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
