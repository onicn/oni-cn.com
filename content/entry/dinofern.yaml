          • <link="CHLORINEGAS">氯气</link>的供给
          • 生长周期：9.0周期
          • <link="HEAT">温度</link>：-45至15ºC
          • <link="ATMOSPHERE">气压</link>：最低500克
          • <link="ATMOSPHERE">环境</link>：
