- contents:
  - widget_type: CodexText
    text: >-
      <i>拜伦利斯巨型叶状体</i>，俗称“巨蕨”，是一种使周围环境相形见绌的巨型植物。


      其大小并不是种植过程的唯一难题：巨蕨之所以能生长至如此巨大，要得益于它对其他生物（包括农民）很少喜欢的低温和腐蚀性气体环境的独特适应性。


      尽管困难重重，但为了吹嘘和谷物收成，这一切是值得的。
    style: Body
  layout: Vertical
