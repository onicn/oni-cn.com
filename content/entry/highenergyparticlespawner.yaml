id: HIGHENERGYPARTICLESPAWNER
parent_id: BUILDCATEGORYHEP
name: 辐射粒子发生器
disabled: False
search_only: False
category: BUILDCATEGORYHEP
sort_string: 辐射粒子发生器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="HIGHENERGYPARTICLESPAWNER">辐射粒子发生器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 进阶材料科学研究
    style: Body
    image: research_type_alpha_icon
    link_id: advancednuclearresearch
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: radiation_collector_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      吸收附近的<link="RADIATION">辐射</link>以生成辐射粒子。


      向你选择的方向释放生成的辐射粒子。


      储存的辐射粒子在建筑禁用时会快速衰减。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="BUILDABLERAW">矿物原料</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+5千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">5千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    辐射粒子输出口'
    tooltip: 这个建筑有一个可设置的辐射粒子端口，用于释放<style="KKeyword">辐射粒子</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>辐射粒子对于材料科学研究是十分必要的。</i>
    style: Body
  layout: Vertical
