content_container:
- contents:
  - widget_type: CodexText
    text: <link="MANUALGENERATOR">人力发电机</link>
    style: Title
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: generatormanual_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 将人力转化为<link="POWER">电力</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：+400瓦'
    tooltip: 为相连的<style="KKeyword">电路</style>产生<style="produced">400瓦</style>电力
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1000复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1000复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSGENERATORTYPE">发电机</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSGENERATORTYPE">基础发电机</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>看复制人在上面跑步很好玩……电力只是额外的好处而已。</i>
