- contents:
  - widget_type: CodexText
    text: >-
      逸蜥是一种温顺的爬行类生物，其生存哲学以能量消耗最小化为核心。


      这种物种曾被誉为现存速度最快的陆生小动物。但如今，它们对体力消耗的极度厌恶已超越了逃避天敌的本能。研究人员至今无法确定逸蜥储存能量，如果真有的话，究竟意欲何为。
    style: Body
  layout: Vertical
