  layout: Horizontal
- contents:
  - widget_type: CodexText
    text: >-
      逸蜥是一种没有敌意的小动物，以<link="DEWDRIP">露珠</link>为食并排出<link="BLEACHSTONE">漂白石</link>和<link="CHLORINEGAS">氯气</link>。


      逸蜥是<link="RAPTOR">霸王鹦</link>的猎物。
    style: Body
  layout: Vertical
