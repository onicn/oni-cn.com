- contents:
  - widget_type: CodexText
    text: >-
      羽叶果薯含有十几种高度稳定的花青素，数量是其他植物的两倍。如此高浓度的类黄酮不仅造就了块茎鲜艳的色泽，还赋予其极强的耐寒性。


      羽叶果薯的整个块茎，包括外皮，都可以安全食用。顶部羽毛状的部分还可以用来在餐后掸去下巴上的食物碎屑。
