- contents:
  - widget_type: CodexText
    text: >-
      抛壳蟹只要周围没有它们的蛋，就是一种没有敌意的小动物。


      抛壳蟹以<link="TOXICSAND">污染土</link>和<link="COMPOST">腐烂物</link>为食。


      抛壳蟹脱壳后留下的壳可以粉碎成<link="LIME">石灰</link>。
    style: Body
  layout: Vertical
