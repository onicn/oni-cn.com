content_container:
- contents:
  - widget_type: CodexText
    text: 抛壳蟹
    style: Title
  - widget_type: CodexText
    text: 可驯化的小动物
    style: Subtitle
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 抛壳蟹是底栖的无脊椎动物，以其他生物的废物和丢弃的食物为生。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 它们有非常大的螯，可以安全地折叠到它们的壳中，在不使用的时候可作保护。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 当抛壳蟹成年后，它们必须定期抛掉它们的部分外骨骼，为生长腾出空间。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 尽管最令人激动的脱壳最早发生在抛壳蟹青年时期，但成年后它们也仍会继续生长和脱壳，直到它们最终死去。
    style: Body
  layout: Vertical
- contents:
