  - widget_type: CodexDividerLine
  - widget_type: CodexText
    text: 动物捕草是肉食性植物，会抓住毫无戒心的小型和中型小动物并将其消化，释放<link="HYDROGEN">氢气</link>作为废物。
    style: Body
  - widget_type: CodexText
    text: >-
      <b>生长需求</b>：
          • 最大<link="RADIATION">辐射</link>：2,200拉德/周期
          • 生长周期：30.0周期
          • <link="HEAT">温度</link>：-90.1至-0.1ºC
          • <link="DIRTYWATER">污染水</link>：-10千克/周期
          • 农地
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <b>效果</b>：
          • <link="PLANTMEAT">植物肉</link>：12,000千卡
          • <link="DECOR">装饰度</link>：+15（范围：2格）
    style: Body
