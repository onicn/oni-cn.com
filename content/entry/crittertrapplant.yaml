content_container:
- contents:
  - widget_type: CodexText
    text: 土星动物捕草
    style: Title
  - widget_type: CodexText
    text: 食肉植物
    style: Subtitle
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      土星动物捕草是一种食肉性植物，它等待毫无戒备的小动物经过，然后将其困住食用。


      土星动物捕草的捕食机制反映出它所在的放射性生态的严酷。


      一旦被困在这种致命的植物中，小动物就会慢慢窒息，然后被捕草叶子内侧层的强力酸性酶消化。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: venus_critter_trap_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
