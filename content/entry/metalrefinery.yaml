id: METALREFINERY
parent_id: BUILDCATEGORYREFINING
name: 金属精炼器
disabled: False
search_only: False
category: BUILDCATEGORYREFINING
sort_string: 金属精炼器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="METALREFINERY">金属精炼器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 熔炼
    style: Body
    image: research_type_alpha_icon
    link_id: smelting
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: metalrefinery_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      使用<link="RAWMETAL">金属矿石</link>原料生产<link="REFINEDMETAL">精炼金属</link>。


      将输入的<link="ELEMENTSLIQUID">液体</link>大幅<link="HEAT">加热</link>并将其输出。


      只有在队列中安排配方复制人才会进行制作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：1.2千瓦'
    tooltip: 必须与至少有<style="consumed">1.2千瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输入管道</link>'
    tooltip: 必须从<link="LIQUIDCONDUIT">液体管道</link>系统中接收<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LIQUIDPIPING">液体输出管道</link>'
    tooltip: 必须通过<link="LIQUIDCONDUIT">液体管道</link>系统排出<style="KKeyword">液体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x4格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：60秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="BUILDABLERAW">矿物原料</link>800千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+16千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">16千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>精炼金属是制作先进的电子产品和技术产品所必需的材料。</i>
    style: Body
  layout: Vertical
