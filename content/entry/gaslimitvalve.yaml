id: GASLIMITVALVE
parent_id: BUILDCATEGORYHVAC
name: 气体计量阀
disabled: False
search_only: False
category: BUILDCATEGORYHVAC
sort_string: 气体计量阀
content_container:
- contents:
  - widget_type: CodexText
    text: <link="GASLIMITVALVE">气体计量阀</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 暖通空调
    style: Body
    image: research_type_alpha_icon
    link_id: hvac
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: limit_valve_gas_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 连至<link="LOGIC">自动化</link>电路中，当特定量的<link="ELEMENTSGAS">气体</link>通过后自动地阻断气体流通。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：10瓦'
    tooltip: 必须与至少有<style="consumed">10瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GASPIPING">气体输入管道</link>'
    tooltip: 必须从<link="GASCONDUIT">气体管道</link>系统中接收<style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GASPIPING">气体输出管道</link>'
    tooltip: 必须通过<link="GASCONDUIT">气体管道</link>系统排出<style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：1格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>25千克, <link="PLASTIC">塑料</link>50千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    重置计量值'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：重置数量

      • <b><style="logic_off">红色信号</style></b>：无效果
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    达到限制'
    tooltip: >-
      输出端行为：

      • 当达到限制时，输出<b><style="logic_on">绿色信号</style></b>

      • 否则，输出<b><style="logic_off">红色信号</style></b>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-5（范围：1格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>1</b>格内降低<b><b>-5</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>计量阀可以在通过精确量的气体后关闭。</i>
    style: Body
  layout: Vertical
