    text: >+
      <b><i>《逐星客》</i>赞誉摘录：</b>


      “难以言喻的美。”


      <indent=10%>——付立，<i>《此刻与明日之间》</i>作者</indent>


      “世界顶级科学巨匠谱写的震撼诗篇。”


      <indent=10%>——奎恩·凯利，吹擂书评</indent>


      “读过此书若不为之振奋，我甘愿认输。”


      <indent=10%>——多洛雷斯·格林，新平面出版社</indent>


      ------------------

    style: Body
