- contents:
  - widget_type: CodexText
    text: 发光虫的身体具有生物发光能力，可用于交流、寻找其他同类以及进行沟通。
    style: Body
  - widget_type: CodexText
    text: 发光虫寻找伙伴时错误地接近非生命光源屡见不鲜。
    style: Body
  - widget_type: CodexText
    text: 发光虫的翅膜非常脆弱，直接触摸它的翅膜是不明智的。
    style: Body
  - widget_type: CodexText
    text: 可以轻抚发光虫身体的其他任何部位，但由于其外骨骼通常会很脆弱，建议抚摸时仍然要轻柔。
    style: Body
  layout: Vertical
