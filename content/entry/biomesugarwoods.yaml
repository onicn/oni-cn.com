- contents:
  - widget_type: CodexText
    text: 富含<link="SNOW">雪</link>的花蜜生态是大型<link="SPACETREE">糖心树</link>的家园。这种复杂的植物可产生<link="SUGARWATER">花蜜</link>，能提炼成<link="SUCROSE">蔗糖</link>和<link="STEAM">蒸汽</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <link="SEALSPECIES">栓角海豹</link>能食用这种甜味液体，并产生<link="ETHANOL">乙醇</link>以支持殖民地的燃料供应。栓角海豹的养殖还能获得<link="TALLOW">动物油脂</link>，一种油性物质，可用于<link="FOOD">食物</link>，或者提炼成<link="CRUDEOIL">原油</link>以支持本地的<link="POWER">电力</link>系统。


      在<link="ICE">冰</link>和<link="SNOW">雪</link>的下面埋藏着大量固态<link="MERCURY">汞</link>沉积物，这是一种稀有金属，可液化后用于工业冷却系统。


      这种生态的景象值得一看：除了偶尔的<link="ICEFLOWER">恬静花</link>带来柔和魅力之外，<link="LIGHTBUG">发光虫</link>的光照在这片冻土之上也令人心动。
    style: Body
