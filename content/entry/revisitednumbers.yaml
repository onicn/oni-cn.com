      <smallcaps>[声纹识别系统初始化完成]

      [识别编号：A001、B111]</smallcaps>


      [录音开始]


      杰姬：琼斯博士预计，传统燃料不足以让舱飞行。


      奥莉维亚：我们需要调整它的规格，尽可能使用更轻的材料，减轻它的重量，在整个项目中进行更广泛的优化。


      杰姬：我们已经别无选择了。


      奥莉维亚：不，绝对不行。你需要我，于是我-我回来了，但如果你打算恢复我们的研究的话——


      杰姬：无论如何，这个世界注定要这样，奥莉维亚。我们需要使用我们获得的优势……想想看吧！要是我们在舱中运用[受屏蔽]技术，不仅能修正舱的飞行问题，而且还能让它运行数千年，甚至更久。


      [录音结束]
