id: SOLIDTRANSFERARM
parent_id: BUILDCATEGORYCONVEYANCE
name: 自动清扫器
disabled: False
search_only: False
category: BUILDCATEGORYCONVEYANCE
sort_string: 自动清扫器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="SOLIDTRANSFERARM">自动清扫器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 智能存储
    style: Body
    image: research_type_alpha_icon
    link_id: smartstorage
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: conveyor_transferarm_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      通过抽吸附近所有的<link="DECOR">杂物</link>来自动完成<link="CHORES">清扫</link>和<link="CHORES">供应</link>任务。


      材料会自动地传送到范围内的任何<link="SOLIDCONDUITINBOX">运输装载器</link>、<link="SOLIDCONDUITOUTBOX">运输存放器</link>、存储点或建筑。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    技能：<link="ENGINEERING1">机电工程</link>'
    tooltip: 必须至少有一名<link="ENGINEERING1">机电工程</link>技能的复制人才能建造这个建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x1格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+2千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">2千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-15（范围：3格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>3</b>格内降低<b><b>-15</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>自动清扫器的范围可以通过(ClickType/clicking)建筑查看。</i>
    style: Body
  layout: Vertical
