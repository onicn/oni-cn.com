- contents:
  - widget_type: CodexText
    text: >-
      我几小时后醒来，冈德森正把最后一只小猫放进他推车里铺着毛巾的箱子。那只猫早已在箱子里蹭着孩子们了。


      冈德森对这些畸形特征毫不在意。他意味深长地看了眼上锁的大门：“那些罐子本来就不是永久性的。”说完又盖了条毛巾在“猫”身上，吹着口哨推车离开了。


      ------------------


      我洗了三遍才把制服上的粘液弄干净。呕。


      那扇门后面的东西，绝对<i>不该</i>出现在这个世界里。


      我该……上报吗？该向谁报告？又<i>能</i>报告什么？


      [录音结束]
