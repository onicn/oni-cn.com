      [录音开始]


      我在生物废料处理厂工作好几周了。说难听点就是个高级垃圾桶看守员。偶尔有实验室技术员推着巨型钢罐上坡，但从不久留。除了那个清洁工。他每周来两次，打扫……那些门后面的什么东西。


      人人都说私营安保钱多事少，可没人提过还有个无声杀手：无聊。


      场地禁止携带私人设备，我只能数东西解闷。


      污水处理入口的灌木有三十九片叶子。我的闭路电视监视器上有十七道划痕。抽屉里两枚回形针。


      ------------------


      昨晚6区传感器突然报警。摄像头里一切正常，当时我正数天花板格栅数到一半。我跑过去查看，但整片区域空无一人。


      总觉得有东西在盯着我，但两次彻底搜查都确认只有我自己。我重置传感器后回到岗位。


      ------------------


      过去两班岗，那些传感器每二十分钟就响一次！每次都得横穿整个6区，结果全是误报。


      打电话给IT部，果然没人接。


      现在我只能在这潮湿闷热的毒雾里来回瞎跑。


      我喘口气时见到了清洁工。他在推车里翻找半天，递给我一件衬衫，说是干净的。


      我礼貌地拒绝了。


      [录音结束]


      ------------------

