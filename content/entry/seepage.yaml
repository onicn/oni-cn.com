      <smallcaps><b>[检测到文件片段]</b>


      [声纹识别系统不可用]</smallcaps>


      [录音开始]


      是只猫。这就是触发传感器的原因。一只橘色流浪胖猫。


      我拐过墙角时，它正在水坑边喝水。没项圈。我想抓它时窜得飞快。也好，这玩意八成浑身是病。


      得想个法子引开它，省得我再跑断腿。


      ------------------


      那只猫跟着炸鱼条一路来到我的值班亭。


      我在角落铺了毛巾让它睡觉，一转身发现它霸占了我的椅子。我挥手赶它，它居然闭眼睡了。最后我不得不连猫带椅掀翻到毛巾上。


      ------------------


      几小时后拜伦博士经过，她很好，只是脸色比平时更憔悴。


      那只猫躲到她离开才从桌子下面冒头。看到它胡须上的蛋黄酱，我就知道我的午餐遭了殃。


      我拎起它准备扔出去时……它居然呼噜起来了。啧，它是真喜欢我？还是只爱蛋黄酱？


      突然好奇它还喜欢什么。


      ------------------


      现在每天清点那只猫带来的“礼物”成了我的新日常。


      目前战绩：三只老鼠、九条毛毛虫，还有片可能是鸟翅的东西。那可比它能逮住的鸟大得多。


      冈德森，也就是那个清洁工，自从猫来了后几乎天天都在。虽然话不多，但有人作伴挺好的。


      关键是他会在我被熏死前清理掉猫的“礼物”。


      ------------------


      那猫原来不是公的。它是<i>母猫</i>！而且还是<i>猫妈妈</i>。


      两小时前，它在我腿上生了一窝崽！


      三只小猫都活下来了。但浑身都是诡异的粘液，而且……它们都点不对劲。其中两只头顶有小肉瘤，像角一样。第三只背部有一排隆起。这是什么情况啊？？


      这也太瘆人了。不碰它们我就够不着电话，可我又实在不想碰它们。


      我的腿都麻了。那只猫还在不停呼噜着舔崽，它看不出自己生了一窝外星生物吗！？




      ------------------

