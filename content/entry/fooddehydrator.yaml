id: FOODDEHYDRATOR
parent_id: BUILDCATEGORYFOOD
name: 脱水机
disabled: False
search_only: False
category: BUILDCATEGORYFOOD
sort_string: 脱水机
content_container:
- contents:
  - widget_type: CodexText
    text: <link="FOODDEHYDRATOR">脱水机</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 美食制备
    style: Body
    image: research_type_alpha_icon
    link_id: finerdining
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: dehydrator_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      使用少量、均匀的热量除去符合条件的<link="FOOD">食物</link>中的水分，并使其能稳定储存。


      脱水的食物必须在<link="FOODREHYDRATOR">充水机</link>中处理才能食用。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="METHANE">天然气</link>：20克/秒'
    tooltip: 使用时消耗<style="consumed">20克/秒</style><style="KKeyword"><link="METHANE">天然气</link></style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="GASPIPING">气体输入管道</link>'
    tooltip: 必须从<link="GASCONDUIT">气体管道</link>系统中接收<style="KKeyword">气体</style>
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克, <link="PLASTIC">塑料</link>100千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    弄湿地面'
    tooltip: 这个建筑使用时会把<style="KKeyword">水</style>倒在地面上
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="CARBONDIOXIDE">二氧化碳</link>：5克/秒'
    tooltip: >-
      使用时产生<style="produced">5克/秒</style><style="KKeyword"><link="CARBONDIOXIDE">二氧化碳</link></style>


      输出温度至少为<b>75ºC</b>，如果输入材料的温度更高输出也会随之更高。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+4千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">4千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>一些脱除的液体不可避免地会洒在地上。</i>
    style: Body
  layout: Vertical
