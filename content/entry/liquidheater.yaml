id: LIQUIDHEATER
parent_id: BUILDCATEGORYUTILITIES
name: 液体加热器
disabled: False
search_only: False
category: BUILDCATEGORYUTILITIES
sort_string: 液体加热器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="LIQUIDHEATER">液体加热器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 液体微调
    style: Body
    image: research_type_alpha_icon
    link_id: liquidtemperature
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: boiler_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      加热大量的<link="ELEMENTSLIQUID">液体</link>。


      必须完全浸没。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：960瓦'
    tooltip: 必须与至少有<style="consumed">960瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：4格宽x1格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+4064千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">4064千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    目标<link="HEAT">温度</link>：85ºC'
    tooltip: 当环境平均<style="KKeyword">温度</style>高于<b>85ºC</b>时停止加热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：125ºC'
    tooltip: 达到<b>125ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>加热器将液体加热以至可杀死其中的病菌。</i>
    style: Body
  layout: Vertical
