- contents:
  - widget_type: CodexText
    text: >-
      蚋虱是一种昆虫类小动物，需要从复制人或其他小动物身上获取额外的营养和矿物质，以弥补其过度发达的生殖系统所带来的巨大能量消耗。


      蚋虱的触角兼具上颌触须功能，分布着高度灵敏的嗅觉神经元，使它们能够从极远距离精准定位营养来源。


      然而，这些受体一旦感知到生物呼吸模式的特定变化，例如发起致命反击前的急促吸气，便会立即触发蚋虱的飞行逃逸反应。
    style: Body
  layout: Vertical
