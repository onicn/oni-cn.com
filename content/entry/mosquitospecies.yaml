- contents:
  - widget_type: CodexText
    text: >-
      蚋虱是一种飞行害虫，主要作为肉食性<link="FLYTRAPPLANT">露饵花</link>的食物以产生<link="AMBER">琥珀</link>。


      蚋虱的后代必须接触<link="ELEMENTSLIQUID">液体</link>才能存活。
    style: Body
  layout: Vertical
