  - widget_type: CodexText
    text: >-
      粘土是一种在自然条件下由石头和土壤组成的柔软混合物，在高<link="HEAT">温</link>下会变硬。


      它是一种可靠的<b>建造材料</b>。


      资源种类：<link="FARMABLE">可耕种的泥土</link>

      熔点：926.9ºC

      硬度：<color=#71ABCFFF>5（非常柔软）</color>


      比热容：0.920 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.65

      辐射释放量/1000千克：0拉德/周期


      属性：<link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, <link="FARMABLE">可耕种的泥土</link>
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
