- contents:
  - widget_type: CodexText
    text: >-
      贫瘠虫果芽细长的茎限制了营养物质和酶向结果枝条的分布。这导致了可靠但相对无味的果实。


      将<link="DIVERGENTSPECIES">异化虫</link>引入这些植物附近可以使其发育成<link="SUPERWORMPLANT">虫果芽</link>，具有更强的维管系统与更高品质的果实。
    style: Body
  layout: Vertical
