    text: >-
      <b>生长需求</b>：
          • 最大<link="RADIATION">辐射</link>：7,400拉德/周期
          • 生长周期：5.0周期
          • <link="HEAT">温度</link>：-10至85ºC
          • <link="ATMOSPHERE">环境</link>：
              • <link="WATER">水</link>
              • <link="DIRTYWATER">污染水</link>
              • <link="SALTWATER">盐水</link>
              • <link="BRINE">浓盐水</link>
              • <link="PHYTOOIL">植物润滑油</link>
              • <link="NATURALRESIN">树脂</link>
          • <link="TOXICSAND">污染土</link>：-10千克/周期
          • 农地
    style: Body
  - widget_type: CodexSpacer
