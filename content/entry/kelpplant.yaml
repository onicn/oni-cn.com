- contents:
  - widget_type: CodexText
    text: >-
      海梳蕨是超高效的光合作用植物。尽管大多数植物向光生长，但这种水生蕨类的能量需求很低，使其能够优先考虑其他生存需求。


      它生长在充满液体的洞穴的顶部，卷须向下垂悬，轻拂经过的小动物。这种接触可鼓励小动物食用这种植物，并排出有利于其持续生长的肥料。
    style: Body
  layout: Vertical
