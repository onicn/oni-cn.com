    text: >-
      (C<sub>3</sub>H<sub>6</sub>)<sub>n</sub> <link="POLYPROPYLENE">塑料</link>是一种热塑性聚合物。


      它适合用来建造各种先进的建筑和设备。


      资源种类：人造材料

      熔点：159.9ºC

      硬度：<color=#71ABCFFF>1（非常柔软）</color>


      比热容：1.920 (DTU/g)/ºC

      热导率：0.150 (DTU/(m*s))/ºC

      辐射吸收因数：0.85

      辐射释放量/1000千克：0拉德/周期


      属性：抗菌物, <link="PLASTIC">塑料</link>, <link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, 人造材料
    style: Body
