- contents:
  - widget_type: CodexText
    text: 疫病章鱼是一种能力多样化的食腐生物，能够分解和吸收大多数动植物死亡后留下的残骸。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      其用以包裹内部软骨结构的层层菌泥对人类而言具有很高的致病风险。


      只一勺疫病章鱼菌泥中便含有千兆数量级的病菌，这足以威慑潜在的掠食者，并使其食物溶解。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 不建议把疫病章鱼作为宠物。
    style: Body
  layout: Vertical
- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexSpacer
  layout: Vertical
