id: GEOTUNER
parent_id: BUILDCATEGORYEQUIPMENT
name: 地质调谐仪
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 地质调谐仪
content_container:
- contents:
  - widget_type: CodexText
    text: <link="GEOTUNER">地质调谐仪</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 超热锻造
    style: Body
    image: research_type_alpha_icon
    link_id: hightempforging
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: geotuner_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      提高已分析<link="GEYSERS">间歇泉</link>的产出及其<link="HEAT">温度</link>。


      多个地质调谐仪可以指向小行星上的同一个<link="GEYSERS">间歇泉</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="RESEARCHING2">实地研究</link>技能或<link="BOOSTERRESEARCH1">研究增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    专用房间：实验室'
    tooltip: >-
      必须建在专用<style="KKeyword">房间</style>内


      建成后，<style="KKeyword">房间</style>将变为<style="KKeyword">实验室</style>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：4格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+4.5千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">4.5千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    间歇泉喷发监测器'
    tooltip: >-
      输出端行为：

      • 当间歇泉喷发时，输出<b><style="logic_on">绿色信号</style></b>

      • 否则，输出<b><style="logic_off">红色信号</style></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSSCIENCEBUILDING">科学建筑</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>目标间歇泉在喷发时会收到储存的放大数据。</i>
    style: Body
  layout: Vertical
