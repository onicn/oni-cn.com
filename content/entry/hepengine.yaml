- contents:
  - widget_type: CodexText
    text: >-
      向反应室注入<link="RADIATION">辐射粒子</link>以推动火箭进行太空探索。


      辐射粒子引擎比<link="HYDROGENENGINE">液氢引擎</link>更快，但高度较受限。


      引擎必须通过<link="LAUNCHPAD">火箭平台</link>建造。


      建好引擎后，可以添加更多的火箭舱块。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
