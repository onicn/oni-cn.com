content_container:
- contents:
  - widget_type: CodexText
    text: <link="SPACEHEATER">空间加热器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 温度调节
    style: Body
    image: research_type_alpha_icon
    link_id: temperaturemodulation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: spaceheater_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      放出适度的<link="HEAT">热量</link>。


      需要<link="POWER">电力</link>才能运作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：240瓦'
    tooltip: 必须与至少有<style="consumed">240瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>400千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    严寒抗性'
    tooltip: 使用这个建筑可提供对<style="KKeyword">严寒环境</style>和<style="KKeyword">双脚湿透</style>的暂时免疫
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    目标<link="HEAT">温度</link>：70ºC'
    tooltip: 当环境平均<style="KKeyword">温度</style>高于<b>70ºC</b>时停止加热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：125ºC'
    tooltip: 达到<b>125ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：+10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内提高<b><b>+10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSWARMINGSTATION">升温站</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>空间加热器是解决寒冷湿脚的好方法。</i>
