      • <b><style="logic_off">红色信号</style></b>：关闭并锁定
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>门控系统可以用于阻止复制人进入受限区域。</i>
    style: Body
