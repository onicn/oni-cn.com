id: LOGICMEMORY
parent_id: BUILDCATEGORYAUTOMATION
name: 锁存器
disabled: False
search_only: False
category: BUILDCATEGORYAUTOMATION
sort_string: 锁存器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="LOGICMEMORY">锁存器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 信息处理
    style: Body
    image: research_type_alpha_icon
    link_id: dupetrafficcontrol
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: logic_memory_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      含有一个内存，输出任何储存在内存中的信号。


      输入的信号<i>只会</i>影响到内存，不会通过输出传递。


      发送<b><style="logic_on">绿色信号</style></b>到置位端 (S) 会将内存设置为<b><style="logic_on">绿色信号</style></b>。


      发送<b><style="logic_on">绿色信号</style></b>到复位端 (R) 会将内存重置为<b><style="logic_off">红色信号</style></b>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>25千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    置位端 (S)'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：设置内存为<b><style="logic_on">绿色信号</style></b>

      • <b><style="logic_off">红色信号</style></b>：无效果
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复位端 (R)'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：重置内存为<b><style="logic_off">红色信号</style></b>

      • <b><style="logic_off">红色信号</style></b>：无效果
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    内存输出端'
    tooltip: >-
      输出端行为：

      • 若内存设置为<b><style="logic_on">绿色信号</style></b>，输出<b><style="logic_on">绿色信号</style></b>

      • 若内存设置为<b><style="logic_off">红色信号</style></b>，输出<b><style="logic_off">红色信号</style></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>内存可在置位端 (S) 接收到绿色信号后储存绿色信号，直到复位端 (R) 接收到绿色信号为止。</i>
    style: Body
  layout: Vertical
