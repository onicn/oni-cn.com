id: POWERTRANSFORMER
parent_id: BUILDCATEGORYPOWER
name: 大型变压器
disabled: False
search_only: False
category: BUILDCATEGORYPOWER
sort_string: 大型变压器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="POWERTRANSFORMER">大型变压器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 低阻导体
    style: Body
    image: research_type_alpha_icon
    link_id: prettygoodconductors
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: transformer_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      限制流过变压器的<link="POWER">电力</link>为4千瓦。


      在大的一端接上<link="BATTERY">蓄电池</link>以作为一种调节阀，并防止<link="WIRE">电线</link>获取电力超过4千瓦。


      建造前可旋转。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    输入<link="WIRE">电线</link>'
    tooltip: 大<style="KKeyword">输入口</style>连接任意<style="KKeyword">功率</style>的<style="KKeyword">电线</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    输出<link="WIRE">电线</link>（限制为4千瓦）'
    tooltip: 小<style="KKeyword">输出口</style>会限制<style="KKeyword">电力</style>为4千瓦。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+1000复制热/秒'
    tooltip: >-
      每秒产生<style="produced">1000复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-10（范围：2格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>2</b>格内降低<b><b>-10</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSPOWERBUILDING">电力建筑</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>这是一个变压器，但更大一点。</i>
    style: Body
  layout: Vertical
