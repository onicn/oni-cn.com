id: ADVANCEDCRAFTINGTABLE
parent_id: BUILDCATEGORYEQUIPMENT
name: 焊接台
disabled: False
search_only: False
category: BUILDCATEGORYEQUIPMENT
sort_string: 焊接台
content_container:
- contents:
  - widget_type: CodexText
    text: <link="ADVANCEDCRAFTINGTABLE">焊接台</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 高级研究
    style: Body
    image: research_type_alpha_icon
    link_id: advancedresearch
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: advanced_crafting_table_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      生产高级电子产品和仿生<link="BIONICUPGRADE">增幅块</link>。


      只有在队列中安排配方复制人才会进行制作。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：480瓦'
    tooltip: 必须与至少有<style="consumed">480瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    复制人的操作'
    tooltip: 必须有复制人来才能使这个建筑运行
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: >-
      只有具有<link="TECHNICALS2">电气工程</link>

      <link="BIONICSC1">原理图</link>技能或<link="BOOSTEROP1">电气工程增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：30秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>焊接台允许复制人制造寻回机器人飞寻机。</i>
    style: Body
  layout: Vertical
- contents:
