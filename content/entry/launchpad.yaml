id: LAUNCHPAD
parent_id: BUILDCATEGORYROCKETRY
name: 火箭平台
disabled: False
search_only: False
category: BUILDCATEGORYROCKETRY
sort_string: 火箭平台
content_container:
- contents:
  - widget_type: CodexText
    text: <link="LAUNCHPAD">火箭平台</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 太空计划
    style: Body
    image: research_type_alpha_icon
    link_id: spaceprogram
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: rocket_launchpad_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      建造所有火箭舱块的前置建筑。


      允许火箭在小行星上发射或着陆。


      将建造的<link="MODULARLAUNCHPADPORTSOLID">火箭端口</link>与火箭平台的一侧自动相连。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：7格宽x2格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>800千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：2000ºC'
    tooltip: 达到<b>2000ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    发射火箭'
    tooltip: >-
      输入端行为：

      • 绿色信号：发射火箭

      • 红色信号：取消启动
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输出端</link>'
    tooltip: 当这个建筑状态发生变化时，输出端会输出一个信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    火箭检查表'
    tooltip: >-
      输出端行为：

      • 当火箭准备好飞行时，输出绿色信号

      • 否则，输出红色信号
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    火箭着陆'
    tooltip: >-
      输出端行为：

      • 当火箭在<link="LAUNCHPAD">火箭平台</link>上时，输出绿色信号

      • 否则，输出红色信号
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>一个平台，火箭能够在上面发射和着陆。</i>
    style: Body
  layout: Vertical
