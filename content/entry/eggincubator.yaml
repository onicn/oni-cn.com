id: EGGINCUBATOR
parent_id: BUILDCATEGORYFOOD
name: 孵化器
disabled: False
search_only: False
category: BUILDCATEGORYFOOD
sort_string: 孵化器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="EGGINCUBATOR">孵化器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 动物控制
    style: Body
    image: research_type_alpha_icon
    link_id: animalcontrol
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: incubator_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: >-
      温育<link="CREATURES">小动物</link>蛋直至孵化。


      分配的复制人必须具有<link="RANCHING1">小动物养殖</link>特质。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：240瓦'
    tooltip: 必须与至少有<style="consumed">240瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    需要技能的复制人的操作'
    tooltip: 只有具有<link="RANCHING1">小动物养殖 I</link>技能或<link="BOOSTERRANCH1">养殖增幅块</link>的复制人才能使用这个建筑
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：2格宽x3格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：120秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="REFINEDMETAL">精炼金属</link>200千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="HEAT">热量</link>：+4.5千复制热/秒'
    tooltip: >-
      每秒产生<style="produced">4.5千复制热</style>


      总<style="KKeyword">温度</style>变化受到加热物质的材料属性影响：
          • 质量
          • 比热容
          • 表面积
          • 隔热厚度
          • 热导率
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：90ºC'
    tooltip: 达到<b>90ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：+5（范围：1格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>1</b>格内提高<b><b>+5</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>孵化器可以为几种小动物蛋提供理想的孵化环境。</i>
    style: Body
  layout: Vertical
