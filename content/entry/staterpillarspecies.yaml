    text: >-
      海绵蛞蝓是一种缺水生物，能够在白天吸收<link="ELEMENTSLIQUID">液体</link>。


      在晚上睡觉时，它们会将保存的<link="ELEMENTSLIQUID">液体</link>存放到其附近的<link="LIQUIDCONDUIT">液体管道</link>中。
    style: Body
