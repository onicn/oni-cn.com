    text: 花园生态
    style: Title
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 花园生态是一个温和的环境，有着适合<link="FARMING">耕种</link>的小动物和植物。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      这种生态对以农场为中心的殖民地特别有益。<link="STEGOSPECIES">尖块兽</link>能够帮助收获可食用植物，同时<link="BUTTERFLYSPECIES">拟蛾</link>可加速植物生长。


      在这种生态中<link="POWER">电力</link>系统可以用<link="NICKELORE">镍矿</link>建造，并且有大量的<link="SHALE">页岩</link>可用，所以并不缺乏建造材料。


      殖民地早期可以依靠<link="GARDENFORAGEPLANTPLANTED">菌斑根</link>维持生存。<link="VINEMOTHER">漫殖藤主干</link>在充分生长后会是一种高效的<link="FOOD">食物</link>作物，因为结出<link="VINEFRUIT">漫花果</link>的藤蔓数量变多并不会提高其对<link="WATER">水</link>的需求。


      新殖民地应当能相对容易地在这里生存。
    style: Body
