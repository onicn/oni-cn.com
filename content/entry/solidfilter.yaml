id: SOLIDFILTER
parent_id: BUILDCATEGORYCONVEYANCE
name: 固体筛选器
disabled: False
search_only: False
category: BUILDCATEGORYCONVEYANCE
sort_string: 固体筛选器
content_container:
- contents:
  - widget_type: CodexText
    text: <link="SOLIDFILTER">固体筛选器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 固体管理
    style: Body
    image: research_type_alpha_icon
    link_id: solidmanagement
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: filter_material_conveyor_0__ui
  layout: Vertical
- contents:
  - widget_type: CodexText
    text: 从运输轨道中分离出一种<link="ELEMENTSSOLID">固体材料</link>，将其送入专用<link="SOLIDCONDUIT">运输轨道</link>。
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 需求
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    <link="POWER">电力</link>：120瓦'
    tooltip: 必须与至少有<style="consumed">120瓦</style>可用<style="KKeyword">电力</style>的电路相连
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 建筑特性
    style: Subtitle
  - widget_type: CodexText
    text: '    建筑大小：3格宽x1格高'
    style: Body
  - widget_type: CodexText
    text: '    建造时间：10秒'
    style: Body
  - widget_type: CodexText
    text: '    材料：<link="METAL">金属矿石</link>50千克'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    过热<link="HEAT">温度</link>：75ºC'
    tooltip: 达到<b>75ºC</b>时开始过热
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="LOGIC">信号输入端</link>'
    tooltip: 当接收到信号时，输入端会使这个建筑一种状态发生变化
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    启用/禁用'
    tooltip: >-
      输入端行为：

      • <b><style="logic_on">绿色信号</style></b>：启用建筑

      • <b><style="logic_off">红色信号</style></b>：禁用建筑
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    <link="DECOR">装饰度</link>：-5（范围：1格）'
    tooltip: <style="KKeyword">装饰度</style>在<b>1</b>格内降低<b><b>-5</b></b>
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <b>类别</b>
    style: Subtitle
  - widget_type: CodexText
    text: '    <link="REQUIREMENTCLASSINDUSTRIALMACHINERY">工业机械</link>'
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: <i>除所选的固体外，其他所有固体都会被送入输出运输轨道。</i>
    style: Body
  layout: Vertical
