    text: >
      <smallcaps>[声纹识别系统初始化完成]

      [识别编号：B040]</smallcaps>


      [录音开始]


      三天前，我们完成了我们的第一次非致命性复制人试验，即尼古拉主持的综合突触微观分析和反射过程。从现在起五小时后，提供体#901将会成为我们的历史上第一次人体测试项目。


      即使是在顶点研究所，那是一个比庄严科技规模大一倍的地方，我也可以用我半个职业生涯等待批准，以推进类似这种手术过程的人体试验！但斯特恩主管在此投入太多了，以至于项目进展始终没停过。


      我亲爱的布鲁斯总会说，当你走在正确的路上时，宇宙会帮助你的。他一定会为我们在此的工作感到自豪的。


      [录音结束]


      [录音开始]


      我的生物打印多脑储存室（或者我一直将其称为“超级大脑”）正在运行！刚好及时地拯救了我的工作。


      数据集在提取和处理过程中不断扩大，对于我们艰难地维持其完整性的努力，主管感到越来越不耐烦了。前几天，她把我的报告放在本生灯上，直到火焰烧到她的指尖。


      我只能想象她承受了多大的压力。


      全世界都指望我们了。


      [录音结束]


      [录音开始]


      我凭直觉，将梦境内容分析加入到了数据中然后……哇。解梦学可能在科学上是“肤浅”的，但整合潜意识的叙述产生了一种新的脑谱图——有复杂能力潜能的脑谱图。


      如果这些结果可复制，我们可能即将解开创造合成生物的秘密，它们能进化超出盲目服从命令的能力。


      尼古拉说这与我们的目的无关。当然斯特恩主管肯定不会同意。


      [录音结束]


      [录音开始]


      尼古拉给了我一个数据集用来插入超级大脑。他没说，也不会说这是从哪来的，但即使他说了……也没什么能让我准备好面对这里面装的东西。


      当他看到我的脸时，他嘀咕着，说人们都在叫我“魔怪”而不是“老钉”，然后送我去午休了。


      但我所想的只有那些可怜的灵魂。


      它们有灵魂吗？


      ……我们有吗？


      [录音结束]


      [录音开始]


      完成了。我对记忆传递协议的调整已硬编码到机器中了。


      我刚完成尼古拉就冲了进来。


      可能我太懦弱了，不敢为这些不幸的生物挺身而出，但有了这些新的数据在这……总有一天，它们能捍卫自己。


      [录音结束]

