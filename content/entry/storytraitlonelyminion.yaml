      我善良的复制人的努力得到了回报！我们隐居的邻居同意加入殖民地了。


      他坚持要随身带的纪念品是一个工具箱，虽然上面锈迹斑斑，但似乎有很大的情感价值。


      现在他会和我们一起住，他之前的房子可以拆掉或者作为储藏室使用。
