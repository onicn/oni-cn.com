- contents:
  - widget_type: CodexText
    text: 杂物分析
    style: Subtitle
  - widget_type: CodexText
    text: 加密级别：三
    style: Body
  - widget_type: CodexText
    text: >
      <smallcaps>[声纹识别系统初始化完成]

      [识别编号：B577、B997、B083、A216]</smallcaps>


      [录音开始]


      A216：主管说你们工作组应该有三个人的。基因学家呢？


      B083：他去厕——


      B997：他回家了。


      [长时间的停顿]


      B997：今天是假期。他也有家庭。


      A216：我们都有。这就是为什么这个项目如此急迫的确切原因。


      B997：这东西放深海里一年，又花了一年才带回到地球，这又不是我们的错！微生物样本在途中表现不佳，大多数机器人部件被完全腐蚀。没什么好做——


      B083：——我们正在完全分析它，尽我们所能，吉……猿桥博士。


      A216：好。之后把这些可笑的小灯泡拿下来吧。这里是实验室，又不是复古的“购物中心”。


      [录音结束]

      ------------------

      [录音开始]


      B577：多谢你把这些杂物打包处理。


      B997：我以为你做过了。


      B577：不，我——


      B083：谁拿了我的三明治？


      B997：哎呀又来了。


      B577：莲，你装好运输集装箱了吗？


      B083：讲真的，我已经13个小时没吃东西了。这不好笑。


      B997：有点好笑。


      B577：我们能不能专心一下？


      B997：没人拿了你的三明治，“石头”博士。


      B083：那么为什么我的食物总是失踪？


      B997：也许是给实验室鬼拿走了。或者你就不应该放这一晚上。冈德森可能把它当垃圾带走了。


      B083：他不会到这下面打扫的！


      B997：对。因为如果是这样，我就不用继续清理<i>某人</i>在换班的时候留下的一路的硫酸镁沉积物了。


      B083：那不是我干的！


      B577：听着，我知道我们都很累，而且事情有点怪。但我们越快把它送到发射台上去，它就能越快开始前往太阳的旅程，我们也就可以离开这个阴森的地下三层了。


      B083：好吧。


      B997：好的。


      B083：好吧！


      [录音结束]

      ------------------
