    text: 布丁杯
    style: Subtitle
  - widget_type: CodexText
    text: ''
    style: Body
  - widget_type: CodexText
    text: >
      嘿小伙子，


      在上周末你没来参加你表兄的婚礼，我们真是太想念你了。礼物都很好，但舞池里没有你总感觉空荡荡的。


      达里仕也送出了他的祝福。自从他开始吃你送他的那些粘糊糊的布丁一类的东西之后，他的情况真的好多了。但你有没有机会发一些闻起来不像脚的布丁啊？


      等你不忙的时候就回家看看吧。


      - 巴巴

