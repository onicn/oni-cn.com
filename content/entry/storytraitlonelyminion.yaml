    text: >-
      我在我的殖民地中发现了一个陌生的建筑。里面有动静，但里面的居住者似乎对我们保持警惕。


      如果我们能说服他我们没有恶意，我们很可能最终可以招募到一名新成员<i>以及</i>获得一个有用的新建筑。
