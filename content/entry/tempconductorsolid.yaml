      资源种类：人造材料

      熔点：2676.9ºC

      硬度：<color=#A3649AFF>80（非常坚硬）</color>


      比热容：0.622 (DTU/g)/ºC

      热导率：220.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.6

      辐射释放量/1000千克：0拉德/周期


      属性：<link="METAL">金属矿石</link>, <link="REFINEDMETAL">精炼金属</link>, <link="PLUMBABLE">可做水管的物质</link>, <link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, 人造材料

