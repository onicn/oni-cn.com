- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      菌泥是一种由藻类、真菌和粘多糖组成的生物混合物。


      它可以蒸馏出<link="ALGAE">藻类</link>，挖掘后会释放<link="CONTAMINATEDOXYGEN">污染氧</link>。


      资源种类：有机物

      熔点：125ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：0.200 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.65

      辐射释放量/1000千克：0拉德/周期


      属性：<link="FLYINGCRITTEREDIBLE">诱饵</link>, <link="ELEMENTSSOLID">固体</link>, 有机物
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
