          • <link="CHLORINEGAS">氯气</link>的供给
          • 生长周期：6.0周期
          • <link="HEAT">温度</link>：-25至50ºC
          • <link="ATMOSPHERE">气压</link>：最低25克
          • <link="ATMOSPHERE">环境</link>：
              • <link="CHLORINEGAS">氯气</link>
          • <link="SAND">沙子</link>：-7千克/周期
          • 农地
    style: Body
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      <b>效果</b>：
          • <link="CHLORINEGAS">氯气</link>：6克/秒
          • <link="SALT">盐</link>：65千克
          • 基础<link="PLANTS">种子</link>收获几率：10%
          • <link="DECOR">装饰度</link>：-10（范围：2格）
