- contents:
  - widget_type: CodexText
    text: >-
      栓角海豹是具有魅力的生物，能产生<link="ETHANOL">乙醇</link>。


      它们能吃<link="SUCROSE">蔗糖</link>，也可以直接从<link="SPACETREE">糖心树</link>吸取<link="SUGARWATER">花蜜</link>。
    style: Body
  layout: Vertical
