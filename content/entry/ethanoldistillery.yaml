- contents:
  - widget_type: CodexText
    text: <link="ETHANOLDISTILLERY">乙醇蒸馏器</link>
    style: Title
  - widget_type: CodexLabelWithIcon
    text: 精馏
    style: Body
    image: research_type_alpha_icon
    link_id: distillation
  - widget_type: CodexDividerLine
  layout: Vertical
- contents:
  - widget_type: CodexImage
    image: ethanoldistillery_0__ui
