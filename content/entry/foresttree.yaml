          • 生长周期：4.5周期
          • <link="HEAT">温度</link>：15至40ºC
          • <link="ATMOSPHERE">气压</link>：最低150克
          • <link="DIRT">泥土</link>：-10千克/周期
          • <link="DIRTYWATER">污染水</link>：-70千克/周期
