- contents:
  - widget_type: CodexText
    text: >-
      颚鱼的外貌或许吓人，但对有经验的饲养者而言完全无害。


      这种鱼类因下颌结构特殊而无法正常咀嚼食物，只能吞食体型偏小的猎物。


      尽管基因分析显示它长期独立进化，但仍与<link="PACU">帕库鱼</link>等锯脂鲤科鱼类存在部分相似基因。不过，这并不影响它成为可食用鱼种。
    style: Body
  layout: Vertical
