- contents:
  - widget_type: CodexText
    text: >-
      颚鱼是一种食肉水生小动物，以<link="PACU">帕库鱼</link>为食并产生<link="RUST">铁锈</link>。


      颚鱼对复制人没有危险。
    style: Body
  layout: Vertical
