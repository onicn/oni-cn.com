- contents:
  - widget_type: CodexText
    text: >-
      与其他前脑神经元数量与尖块兽同样低下的生物不同，这种温顺的生物拥有独特的生存优势。


      它们庞大的体型和尖刺状突起让大多数掠食者望而却步。一些民间轶事表明，某些小型物种甚至会收养失去双亲的尖块兽。


      一些专家推测，这种行为可能是为了利用尖块兽的遗传性肌肉亢奋症状（类似不宁腿综合征），它们会规律性地跺击地面，从而震落周围植物上的可口果实。
    style: Body
  layout: Vertical
