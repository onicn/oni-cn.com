- contents:
  - widget_type: CodexText
    text: >-
      尖块兽是没有敌意的小动物，靠<link="VINEMOTHER">漫殖藤</link>维生。


      当它们在<link="PLANTS">植物</link>附近跺脚时，震动会导致可收获的物品掉在地上。
    style: Body
  layout: Vertical
