- contents:
  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: >-
      泥土是一种柔软的、营养丰富的物质，能够维持生命。


      某些<link="FOOD">食物</link>生产中必需要用到它。


      资源种类：<link="FARMABLE">可耕种的泥土</link>

      熔点：326.9ºC

      硬度：<color=#71ABCFFF>2（非常柔软）</color>


      比热容：1.480 (DTU/g)/ºC

      热导率：2.000 (DTU/(m*s))/ºC

      辐射吸收因数：0.75

      辐射释放量/1000千克：0拉德/周期


      属性：<link="BUILDABLEANY">一般建造材料</link>, <link="ELEMENTSSOLID">固体</link>, <link="FARMABLE">可耕种的泥土</link>

      <style="KKeyword">过热温度</style>：-10ºC
    style: Body
  - widget_type: CodexSpacer
  layout: Vertical
