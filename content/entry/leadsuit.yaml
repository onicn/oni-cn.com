  - widget_type: CodexSpacer
  - widget_type: CodexText
    text: 效果
    style: Subtitle
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">运动</style>：-8'
    tooltip: 决定了复制人的默认行走速度。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">烫伤阈值</style>：+726.9ºC'
    tooltip: 决定了复制人会被烫伤的<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">冻伤阈值</style>：-1273.2ºC'
    tooltip: 决定了复制人会被冻伤的<style="KKeyword">温度</style>。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">辐射抗性</style>：+66%'
    tooltip: 决定了复制人抵抗<style="KKeyword">辐射病</style>的难易程度。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">力量</style>：+10'
    tooltip: 决定了复制人的<style="KKeyword">承载能力</style>和清洁速度。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">隔热</style>：+50'
    tooltip: <style="KKeyword">隔热值</style>高的复制人更容易保持温暖，而<style="KKeyword">隔热值</style>低的复制人更容易保持凉爽。
    style: Body
  - widget_type: CodexTextWithTooltip
    text: '    • <style="KKeyword">隔热厚度</style>：+30.0 cm'
    tooltip: >-
      决定了复制人在特定区域维持或失去身体<style="KKeyword">热量</style>的速度。


      这是复制人的<style="KKeyword">装备</style>和自身<style="KKeyword">隔热值</style>之和。
    style: Body
  layout: Vertical
